<script>
  // ここを好きな合言葉に変更してください
  const CORRECT_PASSWORD = "otegarugazou";

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_image", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_unlocked_image") === "1") {
    unlock();
  }
</script>

<script>

function buildPrompt(s) {
  const style = STYLES.find((x) => x.id === s.style);
  const mood = MOODS.find((x) => x.id === s.mood);
  const composition = COMPOSITIONS.find((x) => x.id === s.composition);
  const lighting = LIGHTINGS.find((x) => x.id === s.lighting);
  const finish = FINISHES.find((x) => x.id === s.finish);
  const reference = REFERENCES.find((x) => x.id === s.reference);
  const textSpace = TEXT_SPACES.find((x) => x.label === s.textSpace);
  const aspect = ASPECTS.find((x) => x.label === s.aspect) || ASPECTS[3];
  const subject = s.subject || "（被写体が未記入です。具体的に描きたいものを書いてください）";

  const extraKeywords = [
    composition?.text,
    lighting?.text,
    finish?.text,
    reference?.text,
    textSpace?.text,
    s.textContent ? `画像内に「${s.textContent}」という文字を入れる` : null,
  ].filter(Boolean);

  let body = "";

  if (s.tool === "Midjourney") {
    const kws = [subject, style?.text, mood?.text, s.colorPref, ...extraKeywords].filter(Boolean).join(", ");
    let line = `/imagine prompt: ${kws}`;
    if (aspect.mj) line += ` --ar ${aspect.mj}`;
    line += " --v 6";
    if (s.avoidThings) line += ` --no ${s.avoidThings}`;
    body = line;
  } else if (s.tool === "Stable Diffusion") {
    const pos = [subject, style?.text, mood?.text, s.colorPref, ...extraKeywords, "high quality, highly detailed"]
      .filter(Boolean)
      .join(", ");
    const neg = s.avoidThings || "low quality, blurry, watermark, extra limbs";
    body = `【ポジティブプロンプト】\n${pos}\n\n【ネガティブプロンプト】\n${neg}`;
    if (aspect.label !== "指定しない") body += `\n\n【アスペクト比】\n${aspect.label}`;
  } else {
    const lines = [];
    lines.push(`${subject}を、${style ? style.text : "ふさわしいスタイル"}で描いてください。`);
    lines.push(`${mood ? mood.text : "自然な雰囲気"}で仕上げてください。`);
    if (composition) lines.push(`構図は、${composition.text}にしてください。`);
    if (lighting) lines.push(`光は、${lighting.text}を意識してください。`);
    if (finish) lines.push(`全体の仕上がりは、${finish.text}をイメージしてください。`);
    if (reference) lines.push(`参考の雰囲気として、${reference.text}を意識してください。`);
    if (s.colorPref) lines.push(`色味は${s.colorPref}を意識してください。`);
    if (textSpace?.text) lines.push(textSpace.text + "ください。");
    if (s.textContent) lines.push(`画像内に「${s.textContent}」という文字を入れてください。`);
    if (aspect.label !== "指定しない") lines.push(`画像の比率は${aspect.label}にしてください。`);
    if (s.avoidThings) lines.push(`次の要素は入れないでください：${s.avoidThings}`);
    lines.push("不明な点があれば、先に質問してから進めてください。");
    body = lines.join("\n");
  }

  if (s.extraRequest) {
    body += `\n\n【追加のお願い】\n${s.extraRequest}`;
  }

  if (s.textContent) {
    body += `\n\n※文字入れは画像生成AIが苦手な場合が多く、誤字や崩れが起きやすいです。うまくいかない場合はCanvaなどで後から文字を重ねるのがおすすめです。`;
  }

  return body;
}

function buildFollowUpPrompt(s) {
  const change = s.variationChange || "（変えたい部分を書いてください。例：ポーズ、表情、服装、背景など）";

  if (s.tool === "ChatGPT・DALL-E") {
    return [
      `さっき生成してもらった画像の人物・雰囲気はそのままで、次の部分だけ変えてください：`,
      `${change}`,
      ``,
      `※このフォロープロンプトは、最初の画像を生成した「同じ会話（チャット）の中」で送ってください。新しいチャットで送ると、AIが元の画像を覚えていないため別人になってしまいます。`,
    ].join("\n");
  }

  if (s.tool === "Midjourney") {
    return [
      `1枚目の画像が生成されたら、画像の下に表示される「Seed」の数字を確認してください（絵文字リアクションの✉️から「Seed」と送ると数字が届きます）。`,
      ``,
      `そのSeed番号を使って、元のプロンプトの末尾に --seed [数字] を追加し、変えたい部分だけ書き換えて再生成してください。`,
      ``,
      `変えたい部分：${change}`,
      ``,
      `※Seedを固定しても、変更点によっては人物の雰囲気が多少変わることがあります。`,
    ].join("\n");
  }

  if (s.tool === "Stable Diffusion") {
    return [
      `1枚目を生成したときのSeed値をメモしておいてください（生成情報や履歴から確認できます）。`,
      ``,
      `同じSeed値・同じポジティブプロンプトをベースに、次の部分だけ書き換えて再生成してください。`,
      ``,
      `変えたい部分：${change}`,
      ``,
      `※LoRAやIP-Adapterなど、キャラクターの顔を固定する専用の仕組みを使うと、さらに一貫性が高まります（発展的な内容です）。`,
    ].join("\n");
  }

  // Canva AI / まだ決めていない など
  return [
    `このツールには「同じ人物を保つ」専用の機能がない場合が多いです。`,
    `完成プロンプトの被写体・スタイル・雰囲気の部分はそのまま使い、次の部分だけ書き換えて再生成してみてください。`,
    ``,
    `変えたい部分：${change}`,
    ``,
    `※完全に同じ人物にはなりにくいので、シリーズ物として作る場合はMidjourneyかStable Diffusion（Seed固定）の使用がおすすめです。`,
  ].join("\n");
}

const HISTORY_KEY = "promptlab_image_history";
const HISTORY_LIMIT = 100;

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `image-prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHistoryLabel(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const detail = s.subject || "";
  const label = `${purpose ? purpose.label : "画像生成"} / ${detail}`.trim();
  return label.length > 60 ? label.slice(0, 60) + "…" : label;
}

// ここに、GASを「ウェブアプリとしてデプロイ」した後のURLを貼り付けてください。
// 未設定の間は何も送信されません（エラーにもなりません）。
const GAS_LOG_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

function logToAdminSheet(toolName, label, promptText) {
  if (!GAS_LOG_URL) return;
  try {
    fetch(GAS_LOG_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        tool: toolName,
        label,
        prompt: promptText,
      }),
    }).catch(() => {});
  } catch (e) {}
}

                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                参考にしたい雰囲気の系統（わかれば）
                <HelpNote>実在の作家名などではなく、系統・ジャンルで指定するのが安全です。空欄でもOKです。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {REFERENCES.map((r) => (
                  <button
                    key={r.id}
                    onClick={() => {
                      setRefId(r.id);
                      update("reference", r.id);
                    }}
                    style={{ ...chip(refId === r.id), textAlign: "left", width: "100%" }}
                  >
                    {r.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 style={sectionTitle}>仕上げ条件を決めてください</h2>
              <p style={sectionSub}>{STEP_INTROS[3]}</p>

              <label style={fieldLabel}>
                文字を乗せるスペースは必要ですか？
                <HelpNote>SNS投稿でキャッチコピーなどを後から重ねる予定がある場合に便利です。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {TEXT_SPACES.map((t) => (
                  <button key={t.label} onClick={() => update("textSpace", t.label)} style={{ ...chip(s.textSpace === t.label), textAlign: "left", width: "100%" }}>
                    {t.label}
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>
                写真に入れたい文字があれば
                <HelpNote>画像生成AIは文字の正確な描画が苦手なことが多いです。短い単語だと成功率が上がります。</HelpNote>
              </label>
              <textarea
                value={s.textContent}
                onChange={(e) => update("textContent", e.target.value)}
                placeholder="例：SALE、期間限定、Coming Soon など短い文字列"
                style={textareaStyle}
                rows={2}
              />

              <label style={fieldLabel}>
                使う予定のツールは？
                <HelpNote>ツールによって読みやすいプロンプトの形式が違うので、最後にその形式へ自動で整えます。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {TOOLS.map((t) => (
                  <button
                    key={t.label}
                    onClick={() => update("tool", t.label)}
                    style={{ ...chip(s.tool === t.label), textAlign: "left", width: "100%" }}
                  >
                    <div style={{ fontWeight: 700 }}>{t.label}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 400 }}>{t.desc}</div>
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>画像の比率</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
                {ASPECTS.map((a) => (
                  <button key={a.label} onClick={() => update("aspect", a.label)} style={chip(s.aspect === a.label)}>
                    {a.label}
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>
                入れたくない要素があれば
                <HelpNote>余計なものが写り込むのを防ぐ「除外指定」です。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.avoidThings}
                onChange={(e) => update("avoidThings", e.target.value)}
                placeholder="例：文字、ロゴ、複数人物、暗すぎる色調"
                style={textareaStyle}
                rows={2}
              />
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 style={sectionTitle}>完成プロンプト — このままコピーして使えます</h2>
              <textarea
                ref={promptRef}
                readOnly
                value={prompt}
                onFocus={(e) => e.target.select()}
                style={{
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#3A2F35",
                  color: "#FFE9D6",
                  padding: "18px 16px",
                  fontSize: 14,
                  lineHeight: 1.7,
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  marginTop: 14,
                  border: "none",
                  borderRadius: 18,
                  resize: "vertical",
                  height: 260,
                }}
              />
              <div style={{ fontSize: 11.5, color: "#B3A5A8", marginTop: 6 }}>
                ボタンが反応しない場合は、上のテキストをタップ／クリックすると全選択されるので、Ctrl+C（Macは⌘+C）でコピーできます。
              </div>
              <button onClick={handleCopy} style={copyBtn}>
                {copied ? <Check size={15} /> : <Copy size={15} />}
                {copied ? "コピーしました" : "プロンプトをコピー"}
              </button>
              {copyFailed && (
                <div style={{ marginTop: 8, fontSize: 12, color: "#D9691F", fontWeight: 600 }}>
                  自動コピーができませんでした。上のテキストが選択状態になっているので、Ctrl+C（Macは⌘+C）でコピーしてください。
                </div>
              )}

              <div style={{ marginTop: 24 }}>
                <label style={fieldLabel}>
                  もう一声！やっぱりここが欲しい、があれば
                  <HelpNote>あとから思いついた条件をここに書くと、末尾に「追加のお願い」として反映されます。</HelpNote>
                </label>
                <textarea
                  value={s.extraRequest}
                  onChange={(e) => update("extraRequest", e.target.value)}
                  placeholder="例：背景はぼかしてほしい、被写体をもっと大きく写してほしい"
                  style={textareaStyle}
                  rows={2}
                />
              </div>

              <div style={{ marginTop: 24 }}>
                <button
                  onClick={() => update("wantVariations", !s.wantVariations)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    width: "100%",
                    textAlign: "left",
                    borderRadius: 16,
                    padding: "14px 16px",
                    border: s.wantVariations ? `2px solid ${COLORS.pink}` : "2px solid #F1E4E8",
                    background: s.wantVariations ? COLORS.pinkSoft : "#FFFFFF",
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  <span
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: 6,
                      flexShrink: 0,
                      background: s.wantVariations ? COLORS.pink : "#FFFFFF",
                      border: s.wantVariations ? "none" : "2px solid #D8C9CC",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#FFFFFF",
                      fontSize: 13,
                      fontWeight: 700,
                    }}
                  >
                    {s.wantVariations ? "✓" : ""}
                  </span>
                  <span>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>
                      同じ人物・キャラクターで複数パターン作りたい
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                      ポーズ違い・表情違いなどのバリエーション作成用に、フォロープロンプトを追加で出します
                    </div>
                  </span>
                </button>

                {s.wantVariations && (
                  <div style={{ marginTop: 14 }}>
                    <label style={fieldLabel}>
                      何を変えたいですか？
                      <HelpNote>ポーズ・表情・服装・背景など、変更したい部分だけ書けばOKです。</HelpNote>
                    </label>
                    <textarea
                      value={s.variationChange}
                      onChange={(e) => update("variationChange", e.target.value)}
                      placeholder="例：正面向きから横顔に変える、笑顔から真剣な表情に変える"
                      style={textareaStyle}
                      rows={2}
                    />

                    <label style={{ ...fieldLabel, marginTop: 18 }}>フォロープロンプト（1枚目のあとに使います）</label>
                    <textarea
                      readOnly
                      value={followUpPrompt}
                      onFocus={(e) => e.target.select()}
                      style={{
                        width: "100%",
                        boxSizing: "border-box",
                        background: "#3A2F35",
                        color: "#FFE9D6",
                        padding: "16px 14px",
                        fontSize: 13.5,
                        lineHeight: 1.7,
                        fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                        whiteSpace: "pre-wrap",
                        wordBreak: "break-word",
                        border: "none",
                        borderRadius: 16,
                        resize: "vertical",
                        height: 180,
                      }}
                    />
                  </div>
                )}
              </div>

              <div style={{ marginTop: 26 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.1em", color: COLORS.mint, fontWeight: 700, marginBottom: 10 }}>
                  ✨ この設計図に使われている工夫
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {PRINCIPLES.map((p) => (
                    <div key={p.tag} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color: "#B8531A",
                          background: COLORS.pinkSoft,
                          borderRadius: 999,
                          padding: "3px 10px",
                          height: "fit-content",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {p.tag}
                      </div>
                      <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{p.body}</div>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={reset} style={resetBtn}>
                <RotateCcw size={13} />
                最初からやり直す
              </button>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
          <button
            onClick={() => setStep((v) => Math.max(0, v - 1))}
            disabled={step === 0}
            style={{ ...navBtn, visibility: step === 0 ? "hidden" : "visible" }}
          >
            <ArrowLeft size={14} /> 戻る
          </button>
          {step < 4 && (
            <button
              onClick={() => setStep((v) => Math.min(4, v + 1))}
              disabled={!canNext}
              style={{ ...navBtn, opacity: canNext ? 1 : 0.4, cursor: canNext ? "pointer" : "not-allowed" }}
            >
              {step === 3 ? "プロンプトを完成させる" : "次へ"} <ArrowRight size={14} />
            </button>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 32, fontSize: 11.5, color: "#B3A5A8" }}>
          <a
            href="https://note.com/cleaning3104"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: "#B8531A", textDecoration: "none", fontWeight: 700 }}
          >
            PROMPT LAB
          </a>{" "}
          by さとぽん
          <span style={{ margin: "0 6px" }}>·</span>
          <button
            onClick={() => setShowChangelog((v) => !v)}
            style={{
              background: "none",
              border: "none",
              color: "#B3A5A8",
              textDecoration: "underline",
              fontSize: 11.5,
              cursor: "pointer",
              fontFamily: "inherit",
              padding: 0,
            }}
          >
            ver.{VERSION}（更新履歴）
          </button>
        </div>

        {showChangelog && (
          <div
            style={{
              marginTop: 12,
              background: "#FFFFFF",
              borderRadius: 16,
              padding: "16px 18px",
              boxShadow: "0 4px 14px rgba(0,0,0,0.06)",
              maxWidth: 420,
              marginLeft: "auto",
              marginRight: "auto",
            }}
          >
            <div style={{ fontSize: 11, fontWeight: 700, color: "#B8531A", marginBottom: 8 }}>更新履歴</div>
            <div style={{ display: "grid", gap: 8 }}>
              {CHANGELOG.map((c) => (
                <div key={c.version} style={{ fontSize: 12, color: "#4A3F41", lineHeight: 1.5 }}>
                  <span style={{ fontWeight: 700 }}>v{c.version}</span>
                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const sectionTitle = { margin: 0, fontFamily: headingFont, fontSize: 20, fontWeight: 700, color: "#4A3F41" };
const sectionSub = { margin: "6px 0 0", fontSize: 13, color: "#8C7B7E" };
const fieldLabel = { display: "block", fontSize: 13, fontWeight: 700, color: "#4A3F41", margin: "18px 0 8px" };

const textareaStyle = {
  width: "100%",
  border: "2px solid #FFE7D6",
  borderRadius: 16,
  background: "#FFFBF8",
  padding: "12px 14px",
  fontSize: 16,
  fontFamily: "inherit",
  resize: "vertical",
  boxSizing: "border-box",
  color: "#4A3F41",
};

const chip = (active) => ({
  padding: "10px 16px",
  fontSize: 13,
  borderRadius: 999,
  border: active ? "2px solid #FF8A4C" : "2px solid #F1E4E8",
  background: active ? "#FFE7D6" : "#FFFFFF",
  color: active ? "#B8531A" : "#4A3F41",
  fontWeight: active ? 700 : 500,
  cursor: "pointer",
  fontFamily: "inherit",
});

const copyBtn = {
  marginTop: 14,
  display: "inline-flex",
  alignItems: "center",
  gap: 8,
  padding: "12px 22px",
  borderRadius: 999,
  background: "#FF8A4C",
  color: "#FFFFFF",
  border: "none",
  fontSize: 14,
  fontWeight: 700,
  cursor: "pointer",
  boxShadow: "0 4px 0 #D9691F",
};

const resetBtn = {
  marginTop: 22,
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "9px 16px",
  borderRadius: 999,
  background: "#FFFFFF",
  color: "#8C7B7E",
  border: "2px solid #F1E4E8",
  fontSize: 12.5,
  cursor: "pointer",
};

const navBtn = {
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "11px 22px",
  borderRadius: 999,
  background: "#4A3F41",
  color: "#FFFFFF",
  border: "none",
  fontSize: 13.5,
  fontWeight: 700,
  cursor: "pointer",
  boxShadow: "0 4px 0 #2E2628",
};

const chipButtonSmall = {
  padding: "6px 12px",
  borderRadius: 999,
  border: "1.5px solid #F1E4E8",
  background: "#FFFFFF",
  color: "#4A3F41",
  fontSize: 11.5,
  fontWeight: 700,
  cursor: "pointer",
  fontFamily: "inherit",
  whiteSpace: "nowrap",
};

ReactDOM.createRoot(document.getElementById("root")).render(<ImagePromptTool />);

</script>

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
