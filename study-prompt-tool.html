<script>
  // ここを好きな合言葉に変更してください
  const CORRECT_PASSWORD = "sensei";

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_study", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_unlocked_study") === "1") {
    unlock();
  }
</script>

<script>
  window.addEventListener("error", function (e) {
    const rootEl = document.getElementById("root");
    const gateEl = document.getElementById("gate");
    if (rootEl && !rootEl.innerHTML) {

      rootEl.style.display = "block";

function buildPrompt(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const level = LEVELS.find((l) => l.id === s.level);
  const goal = GOALS.find((g) => g.id === s.goal);
  const learnStyle = LEARN_STYLES.find((l) => l.id === s.learnStyle);
  const topic = s.topic || "（学びたい内容が未記入です。具体的に書いてください）";

  const lines = [];
  lines.push("あなたは、分かりやすく教えるのが得意な先生です。");
  lines.push("");
  lines.push("【学びたいこと】");
  lines.push(topic);
  if (level) lines.push(`今のレベル：${level.text}`);
  if (goal) lines.push(`目的：${goal.text}`);
  lines.push("");
  lines.push("【教え方の希望】");
  lines.push(`・${learnStyle ? learnStyle.text : "分かりやすい形"}で説明してください`);
  if (s.analogy) lines.push(`・たとえ話は「${s.analogy}」に例えてもらえると理解しやすいです`);
  if (s.wantMistakes) lines.push("・初心者が間違えやすいポイントも、あわせて教えてください");
  lines.push(`・ボリューム感：${s.volume || "じっくり丁寧に"}`);
  if (s.deadline) lines.push(`・スケジュール感：${s.deadline}`);
  lines.push("");
  if (s.wantQuiz) {
    lines.push("【理解度の確認】");
    lines.push("説明が終わったら、理解度を確認する簡単な問題を2〜3問出してください。");
    lines.push("");
  }
  lines.push("質問がある場合は、一度に1〜2個までにしてください。");

  let body = lines.join("\n");

  if (s.extraRequest) {
    body += `\n\n【追加のお願い】\n${s.extraRequest}`;
  }

  return body;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `study-prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHistoryLabel(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const detail = s.topic || "";
  const label = `${purpose ? purpose.label : "学習・勉強"} / ${detail}`.trim();
  return label.length > 60 ? label.slice(0, 60) + "…" : label;
}

const GAS_LOG_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

function logToAdminSheet(toolName, label, promptText) {
  if (!GAS_LOG_URL) return;
  try {
    fetch(GAS_LOG_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        tool: toolName,
        label,
        prompt: promptText,
      }),
    }).catch(() => {});
  } catch (e) {}
}

    } catch (e) {}

    purpose: "",
    topic: "",
    level: "",
    goal: "",
    learnStyle: "",
    analogy: "",
    wantMistakes: false,
    volume: "",
    deadline: "",
    wantQuiz: false,
    extraRequest: "",
  });

  const update = (k, v) => setS((prev) => ({ ...prev, [k]: v }));
  const canNext = step === 0 ? !!s.purpose : true;

  const [history, setHistoryState] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch (e) {
      return [];
    }
  });
  const setHistory = (updater) => {
    setHistoryState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      } catch (e) {}
      return next;
    });
  };
  const [showHistory, setShowHistory] = useState(false);
  const [showChangelog, setShowChangelog] = useState(false);

      timestamp: new Date().toLocaleString("ja-JP"),
      label,
      prompt: promptText,
    };
    setHistory((prev) => [entry, ...prev].slice(0, HISTORY_LIMIT));
  };
  const deleteHistoryEntry = (id) => setHistory((prev) => prev.filter((h) => h.id !== id));
  const clearAllHistory = () => {

      setTimeout(() => setCopiedHistoryId(null), 1500);

        el.select();
        el.setSelectionRange(0, prompt.length);

                marginBottom: 10,

            >
              はじめての方へ
            </div>
            <h2 style={{ margin: "0 0 14px", fontFamily: headingFont, fontSize: 19, color: COLORS.ink }}>
              使い方はかんたん5ステップ
            </h2>
            <div style={{ display: "grid", gap: 10, marginBottom: 16 }}>
              {[
                ["1", "学びたいことの種類を選ぶ"],
                ["2", "内容・今のレベル・目的を教える"],
                ["3", "学び方の希望を選ぶ"],
                ["4", "説明のボリュームなどを決める"],
                ["5", "完成したプロンプトをコピーして、ChatGPTやClaudeに貼り付ける"],
              ].map(([n, t]) => (
                <div key={n} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <span
                    style={{
                      width: 22,
                      height: 22,
                      borderRadius: "50%",
                      background: COLORS.purple,
                      color: "#FFFFFF",
                      fontSize: 12,
                      fontWeight: 700,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      flexShrink: 0,
                    }}
                  >
                    {n}
                  </span>
                  <div style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.5, paddingTop: 1 }}>{t}</div>
                </div>
              ))}
            </div>
            <p style={{ fontSize: 12, color: COLORS.inkSoft, margin: "0 0 18px" }}>
              わからない項目は空欄のままでも大丈夫です。あとから「戻る」でいつでも修正できます。
            </p>
            <button
              onClick={dismissTutorial}
              style={{
                width: "100%",
                padding: "12px",
                borderRadius: 999,
                background: COLORS.purple,
                color: "#FFFFFF",
                border: "none",
                fontSize: 14,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "inherit",
                boxShadow: "0 4px 0 #7451C9",
              }}
            >
              はじめる
            </button>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        {/* Title block */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(55,48,74,0.08)",
            padding: "20px 24px",
            marginBottom: 22,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}
        >
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ fontFamily: headingFont, fontSize: 16, fontWeight: 900, letterSpacing: "0.02em", color: "#5F3FAE" }}>
                PROMPT LAB
              </span>
              <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 500 }}>by さとぽん</span>
            </div>
            <h1
              style={{
                margin: 0,
                fontFamily: headingFont,
                fontSize: 22,
                fontWeight: 700,
                letterSpacing: "-0.01em",
                lineHeight: 1.4,
                color: COLORS.ink,
              }}
            >
              学習・勉強
              <br />
              プロンプト設計ツール
            </h1>
          </div>
          <div
            style={{
              width: 44,
              height: 44,
              borderRadius: "50%",
              background: "#FFF3D6",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
            }}
          >
            <Sparkles size={22} strokeWidth={2} color="#E0A421" />
          </div>
        </div>

        {/* History toggle */}
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
          <button
            onClick={() => setShowHistory((v) => !v)}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: 6,
              padding: "8px 16px",
              borderRadius: 999,
              background: showHistory ? COLORS.ink : "#FFFFFF",
              color: showHistory ? "#FFFFFF" : COLORS.ink,
              border: "2px solid #E7E0F5",
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            📋 履歴（{history.length}）
          </button>
        </div>

        {showHistory && (
          <div
            style={{
              borderRadius: 24,
              background: "#FFFFFF",
              boxShadow: "0 6px 20px rgba(55,48,74,0.08)",
              padding: "22px 24px",
              marginBottom: 22,
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
              <h3 style={{ margin: 0, fontFamily: headingFont, fontSize: 16, color: COLORS.ink }}>保存した履歴</h3>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={() => downloadHistoryCSV(history)}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1 }}
                >
                  CSVダウンロード
                </button>
                <button
                  onClick={clearAllHistory}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1, color: "#C0392B" }}
                >
                  全部削除
                </button>
              </div>
            </div>

            {history.length === 0 ? (
              <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: 0 }}>
                まだ保存されたプロンプトはありません。「プロンプトをコピー」すると自動で保存されます。
              </p>
            ) : (
              <div style={{ display: "grid", gap: 10 }}>
                {history.map((h) => (
                  <div key={h.id} style={{ border: "2px solid #E7E0F5", borderRadius: 14, padding: "12px 14px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                      <div style={{ fontSize: 11, color: "#B3A8C7" }}>{h.timestamp}</div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        <button onClick={() => copyHistoryEntry(h)} style={chipButtonSmall}>
                          {copiedHistoryId === h.id ? "コピー済み" : "コピー"}
                        </button>
                        <button onClick={() => deleteHistoryEntry(h.id)} style={{ ...chipButtonSmall, color: "#C0392B" }}>
                          削除
                        </button>
                      </div>
                    </div>
                    <div style={{ fontWeight: 700, fontSize: 13, marginTop: 4, color: COLORS.ink }}>{h.label}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Step bubbles */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", margin: "0 4px 22px" }}>
          {STEP_LABELS.map((label, i) => {
            const active = i <= step;
            const isLast = i === STEP_LABELS.length - 1;
            return (
              <React.Fragment key={label}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                  <div
                    style={{
                      width: 30,
                      height: 30,
                      borderRadius: "50%",
                      background: active ? COLORS.purple : "#FFFFFF",
                      border: active ? "none" : "2px solid #E7E0F5",
                      color: active ? "#FFFFFF" : "#C4B8DC",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 13,
                      fontWeight: 700,
                      boxShadow: active ? "0 3px 8px rgba(155,123,239,0.4)" : "none",
                    }}
                  >
                    {i + 1}
                  </div>
                  <div
                    style={{
                      marginTop: 6,
                      fontSize: 10.5,
                      fontWeight: active ? 700 : 500,
                      color: active ? COLORS.ink : "#C4B8DC",
                      whiteSpace: "nowrap",
                    }}
                  >
                    {label}
                  </div>
                </div>
                {!isLast && (
                  <div
                    style={{
                      flex: 1,
                      height: 3,
                      borderRadius: 2,
                      margin: "0 4px 18px",
                      background: i < step ? COLORS.purple : "#E7E0F5",
                    }}
                  />
                )}
              </React.Fragment>
            );
          })}
        </div>

        {/* Card */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(55,48,74,0.08)",
            padding: "28px 26px",
            minHeight: 340,
          }}
        >
          {step === 0 && (
            <div>
              <h2 style={sectionTitle}>何を学びたいですか？</h2>
              <p style={sectionSub}>{STEP_INTROS[0]}</p>
              <div style={{ display: "grid", gap: 10, marginTop: 18 }}>
                {PURPOSES.map((p, i) => {
                  const dots = ["#9B7BEF", "#2FB6AA", "#FFC93C", "#8A80A0", "#9B7BEF", "#2FB6AA"];
                  return (
                    <button
                      key={p.id}
                      onClick={() => update("purpose", p.id)}
                      style={{
                        textAlign: "left",
                        borderRadius: 16,
                        padding: "14px 16px",
                        border: s.purpose === p.id ? `2px solid ${COLORS.purple}` : "2px solid #E7E0F5",
                        background: s.purpose === p.id ? COLORS.purpleSoft : "#FFFFFF",
                        cursor: "pointer",
                        fontFamily: "inherit",
                        display: "flex",
                        alignItems: "flex-start",
                        gap: 12,
                      }}
                    >
                      <span
                        style={{
                          width: 10,
                          height: 10,
                          borderRadius: "50%",
                          background: dots[i % dots.length],
                          marginTop: 5,
                          flexShrink: 0,
                        }}
                      />
                      <span>
                        <div style={{ fontWeight: 700, fontSize: 15, color: COLORS.ink }}>{p.label}</div>
                        <div style={{ fontSize: 13, color: COLORS.inkSoft, marginTop: 2 }}>{p.sub}</div>
                      </span>
                    </button>
                  );
                })}
              </div>

              <div
                style={{
                  marginTop: 20,
                  borderRadius: 16,
                  background: "#FFF3D6",
                  border: "2px solid #FFE3A8",
                  padding: "14px 16px",
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A6B1F", marginBottom: 6 }}>ご利用にあたって</div>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: "#6B5A2E", lineHeight: 1.7 }}>
                  {CAUTIONS.map((c, i) => (
                    <li key={i}>{c}</li>
                  ))}
                </ul>
              </div>
            </div>
          )}

          {step === 1 && (
            <div>
              <h2 style={sectionTitle}>学びたいことを教えてください</h2>
              <p style={sectionSub}>{STEP_INTROS[1]}</p>

              <label style={fieldLabel}>
                何を学びたいですか？
                <HelpNote>具体的なほど、的確な説明をしてもらえます。</HelpNote>
              </label>
              <textarea
                value={s.topic}
                onChange={(e) => update("topic", e.target.value)}
                placeholder="例：簿記3級の「減価償却」の考え方"
                style={textareaStyle}
                rows={3}
              />

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                今のレベルは？
                <HelpNote>レベルを伝えないと、簡単すぎたり難しすぎたりする説明が返ってきます。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {LEVELS.map((l) => (
                  <button
                    key={l.id}
                    onClick={() => {
                      setLevelId(l.id);
                      update("level", l.id);
                    }}
                    style={{ ...chip(levelId === l.id), textAlign: "left", width: "100%" }}
                  >
                    {l.label}
                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                学ぶ目的・ゴールは？
                <HelpNote>資格試験か教養かで、必要な深さや範囲が変わります。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {GOALS.map((g) => (
                  <button
                    key={g.id}
                    onClick={() => {
                      setGoalId(g.id);
                      update("goal", g.id);
                    }}
                    style={{ ...chip(goalId === g.id), textAlign: "left", width: "100%" }}
                  >
                    {g.label}
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <h2 style={sectionTitle}>どんな学び方が合いますか？</h2>
              <p style={sectionSub}>{STEP_INTROS[2]}</p>

              <label style={fieldLabel}>理解の仕方は？</label>
              <div style={{ display: "grid", gap: 8 }}>
                {LEARN_STYLES.map((l) => (
                  <button
                    key={l.id}
                    onClick={() => {
                      setLearnStyleId(l.id);
                      update("learnStyle", l.id);
                    }}
                    style={{ ...chip(learnStyleId === l.id), textAlign: "left", width: "100%" }}
                  >
                    {l.label}
                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                身近なたとえ話があれば
                <HelpNote>自分の趣味や仕事に例えてもらうと、ぐっと理解しやすくなります。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.analogy}
                onChange={(e) => update("analogy", e.target.value)}
                placeholder="例：料理、家計簿、部活動 など自分になじみのあるもの"
                style={textareaStyle}
                rows={2}
              />

              <div style={{ marginTop: 18 }}>
                <button
                  onClick={() => update("wantMistakes", !s.wantMistakes)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    width: "100%",
                    textAlign: "left",
                    borderRadius: 16,
                    padding: "14px 16px",
                    border: s.wantMistakes ? `2px solid ${COLORS.purple}` : "2px solid #E7E0F5",
                    background: s.wantMistakes ? COLORS.purpleSoft : "#FFFFFF",
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  <span
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: 6,
                      flexShrink: 0,
                      background: s.wantMistakes ? COLORS.purple : "#FFFFFF",
                      border: s.wantMistakes ? "none" : "2px solid #D8CDEE",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#FFFFFF",
                      fontSize: 13,
                      fontWeight: 700,
                    }}
                  >
                    {s.wantMistakes ? "✓" : ""}
                  </span>
                  <span>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>
                      間違えやすいポイントも教えてほしい
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                      初心者がつまずきやすい所を、先に教えてもらいます
                    </div>
                  </span>
                </button>
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 style={sectionTitle}>仕上げ条件を決めてください</h2>
              <p style={sectionSub}>{STEP_INTROS[3]}</p>

              <label style={fieldLabel}>説明のボリューム</label>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {VOLUMES.map((v) => (
                  <button
                    key={v.label}
                    onClick={() => update("volume", v.label)}
                    style={{ ...chip(s.volume === v.label), textAlign: "left", width: "100%" }}
                  >
                    <div style={{ fontWeight: 700 }}>{v.label}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 400 }}>{v.desc}</div>
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>
                スケジュール感があれば
                <HelpNote>「〇月の試験までに」など伝えると、ペース配分も意識してもらえます。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.deadline}
                onChange={(e) => update("deadline", e.target.value)}
                placeholder="例：来月の試験までに一通り理解しておきたい"
                style={textareaStyle}
                rows={2}
              />

              <div style={{ marginTop: 18 }}>
                <button
                  onClick={() => update("wantQuiz", !s.wantQuiz)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    width: "100%",
                    textAlign: "left",
                    borderRadius: 16,
                    padding: "14px 16px",
                    border: s.wantQuiz ? `2px solid ${COLORS.purple}` : "2px solid #E7E0F5",
                    background: s.wantQuiz ? COLORS.purpleSoft : "#FFFFFF",
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  <span
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: 6,
                      flexShrink: 0,
                      background: s.wantQuiz ? COLORS.purple : "#FFFFFF",
                      border: s.wantQuiz ? "none" : "2px solid #D8CDEE",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#FFFFFF",
                      fontSize: 13,
                      fontWeight: 700,
                    }}
                  >
                    {s.wantQuiz ? "✓" : ""}
                  </span>
                  <span>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>
                      説明のあとに理解度チェックの問題を出してほしい
                    </div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                      読むだけより記憶に残りやすくなります（アクティブリコール）
                    </div>
                  </span>
                </button>
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 style={sectionTitle}>完成プロンプト — このままコピーして使えます</h2>
              <textarea
                ref={promptRef}
                readOnly
                value={prompt}
                onFocus={(e) => e.target.select()}
                style={{
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#2B2440",
                  color: "#EDE4FD",
                  padding: "18px 16px",
                  fontSize: 14,
                  lineHeight: 1.7,
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  marginTop: 14,
                  border: "none",
                  borderRadius: 18,
                  resize: "vertical",
                  height: 260,
                }}
              />
              <div style={{ fontSize: 11.5, color: "#B3A8C7", marginTop: 6 }}>
                ボタンが反応しない場合は、上のテキストをタップ／クリックすると全選択されるので、Ctrl+C（Macは⌘+C）でコピーできます。
              </div>
              <button onClick={handleCopy} style={copyBtn}>
                {copied ? <Check size={15} /> : <Copy size={15} />}
                {copied ? "コピーしました" : "プロンプトをコピー"}
              </button>
              {copyFailed && (
                <div style={{ marginTop: 8, fontSize: 12, color: "#C0392B", fontWeight: 600 }}>
                  自動コピーができませんでした。上のテキストが選択状態になっているので、Ctrl+C（Macは⌘+C）でコピーしてください。
                </div>
              )}

              <div style={{ marginTop: 24 }}>
                <label style={fieldLabel}>
                  もう一声！やっぱりここが欲しい、があれば
                  <HelpNote>あとから思いついた条件をここに書くと、末尾に「追加のお願い」として反映されます。</HelpNote>
                </label>
                <textarea
                  value={s.extraRequest}
                  onChange={(e) => update("extraRequest", e.target.value)}
                  placeholder="例：語呂合わせも一緒に考えてほしい"
                  style={textareaStyle}
                  rows={2}
                />
              </div>

              <div style={{ marginTop: 26 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.1em", color: COLORS.mint, fontWeight: 700, marginBottom: 10 }}>
                  ✨ この設計図に使われている工夫
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {PRINCIPLES.map((p) => (
                    <div key={p.tag} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color: "#5F3FAE",
                          background: COLORS.purpleSoft,
                          borderRadius: 999,
                          padding: "3px 10px",
                          height: "fit-content",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {p.tag}
                      </div>
                      <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{p.body}</div>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={reset} style={resetBtn}>
                <RotateCcw size={13} />
                最初からやり直す
              </button>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
          <button
            onClick={() => setStep((v) => Math.max(0, v - 1))}
            disabled={step === 0}
            style={{ ...navBtn, visibility: step === 0 ? "hidden" : "visible" }}
          >
            <ArrowLeft size={14} /> 戻る
          </button>
          {step < 4 && (
            <button
              onClick={() => setStep((v) => Math.min(4, v + 1))}
              disabled={!canNext}
              style={{ ...navBtn, opacity: canNext ? 1 : 0.4, cursor: canNext ? "pointer" : "not-allowed" }}
            >
              {step === 3 ? "プロンプトを完成させる" : "次へ"} <ArrowRight size={14} />
            </button>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 32, fontSize: 11.5, color: "#B3A5A8" }}>
          <a
            href="https://note.com/cleaning3104"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: "#5F3FAE", textDecoration: "none", fontWeight: 700 }}
          >
            PROMPT LAB
          </a>{" "}
          by さとぽん
          <span style={{ margin: "0 6px" }}>·</span>
          <button
            onClick={() => setShowChangelog((v) => !v)}
            style={{
              background: "none",
              border: "none",
              color: "#B3A5A8",
              textDecoration: "underline",
              fontSize: 11.5,
              cursor: "pointer",
              fontFamily: "inherit",
              padding: 0,
            }}
          >
            ver.{VERSION}（更新履歴）
          </button>
        </div>

        {showChangelog && (
          <div
            style={{
              marginTop: 12,
              background: "#FFFFFF",
              borderRadius: 16,
              padding: "16px 18px",
              boxShadow: "0 4px 14px rgba(0,0,0,0.06)",
              maxWidth: 420,
              marginLeft: "auto",
              marginRight: "auto",
            }}
          >
            <div style={{ fontSize: 11, fontWeight: 700, color: "#5F3FAE", marginBottom: 8 }}>更新履歴</div>
            <div style={{ display: "grid", gap: 8 }}>
              {CHANGELOG.map((c) => (
                <div key={c.version} style={{ fontSize: 12, color: "#4A3F41", lineHeight: 1.5 }}>
                  <span style={{ fontWeight: 700 }}>v{c.version}</span>
                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
