  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_business", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";

  }

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHistoryLabel(s) {

  const label = `${purpose ? purpose.label : "業務効率化"} / ${detail}`.trim();
  return label.length > 60 ? label.slice(0, 60) + "…" : label;
}

const GAS_LOG_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

function logToAdminSheet(toolName, label, promptText) {
  if (!GAS_LOG_URL) return;
  try {
    fetch(GAS_LOG_URL, {
      method: "POST",
      mode: "no-cors", // GAS側はCORSヘッダを返さないため、no-corsで送りっぱなしにする
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        tool: toolName,
        label,
        prompt: promptText,
      }),
    }).catch(() => {});
  } catch (e) {
    // 送信に失敗しても、ツール自体の動作は止めない
  }
}

  const canNext = step === 0 ? !!s.purpose : true;

    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch (e) {
      return [];
    }
  });
  const setHistory = (updater) => {
    setHistoryState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      } catch (e) {}
      return next;
    });
  };
  const [showHistory, setShowHistory] = useState(false);
  const [showChangelog, setShowChangelog] = useState(false);

    const entry = {
      id: Date.now().toString(),
      timestamp: new Date().toLocaleString("ja-JP"),
      label,
      prompt: promptText,
    };
    setHistory((prev) => [entry, ...prev].slice(0, HISTORY_LIMIT));
  };
  const deleteHistoryEntry = (id) => setHistory((prev) => prev.filter((h) => h.id !== id));
  const clearAllHistory = () => {
    if (window.confirm("保存した履歴をすべて削除します。よろしいですか？")) {
      setHistory([]);
    }
  };
  const copyHistoryEntry = async (h) => {
    const ok = await copyText(h.prompt);
    if (ok) {
      setCopiedHistoryId(h.id);
      setTimeout(() => setCopiedHistoryId(null), 1500);
    }
  };

  const promptRef = React.useRef(null);
  const [copyFailed, setCopyFailed] = useState(false);

  const handleCopy = async () => {
    setCopyFailed(false);

    // 1) modern clipboard API
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(prompt);
        setCopied(true);
        addHistoryEntry(buildHistoryLabel(s), prompt);
        logToAdminSheet("業務効率化", buildHistoryLabel(s), prompt);
        setTimeout(() => setCopied(false), 1800);
        return;
      }
    } catch (e) {
      // fall through
    }

    // 2) select the textarea + execCommand (reliable inside iframes)
    try {
      const el = promptRef.current;
      if (el) {
        el.focus();
        el.select();
        el.setSelectionRange(0, prompt.length); // for mobile Safari
        const ok = document.execCommand && document.execCommand("copy");

            <div style={{ display: "grid", gap: 10, marginBottom: 16 }}>
              {[
                ["1", "目的を選ぶ"],
                ["2", "背景を教える（選ぶだけでもOK）"],
                ["3", "出力条件を選ぶ"],
                ["4", "完成したプロンプトをコピーして、ChatGPTやClaudeに貼り付ける"],
              ].map(([n, t]) => (
                <div key={n} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <span
                    style={{
                      width: 22,
                      height: 22,
                      borderRadius: "50%",
                      background: "#5B8DEF",
                      color: "#FFFFFF",
                      fontSize: 12,
                      fontWeight: 700,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      flexShrink: 0,
                    }}
                  >
                    {n}
                  </span>
                  <div style={{ fontSize: 13.5, color: "#4A3F41", lineHeight: 1.5, paddingTop: 1 }}>{t}</div>
                </div>
              ))}
            </div>
            <p style={{ fontSize: 12, color: "#8C7B7E", margin: "0 0 18px" }}>
              わからない項目は空欄のままでも大丈夫です。あとから「戻る」でいつでも修正できます。
            </p>
            <button
              onClick={dismissTutorial}
              style={{
                width: "100%",
                padding: "12px",
                borderRadius: 999,
                background: "#5B8DEF",
                color: "#FFFFFF",
                border: "none",
                fontSize: 14,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "inherit",
                boxShadow: "0 4px 0 #3E68C7",
              }}
            >
              はじめる
            </button>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        {/* Title block */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
            padding: "20px 24px",
            marginBottom: 22,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}
        >
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ fontFamily: headingFont, fontSize: 16, fontWeight: 900, letterSpacing: "0.02em", color: "#2F52A8" }}>
                PROMPT LAB
              </span>
              <span style={{ fontSize: 11, color: "#8C7B7E", fontWeight: 500 }}>by さとぽん</span>
            </div>
            <h1
              style={{
                margin: 0,
                fontFamily: headingFont,
                fontSize: 22,
                fontWeight: 700,
                letterSpacing: "-0.01em",
                lineHeight: 1.4,
                color: "#4A3F41",
              }}
            >
              業務効率化
              <br />
              プロンプト設計ツール
            </h1>
          </div>
          <div
            style={{
              width: 44,
              height: 44,
              borderRadius: "50%",
              background: "#FFF3D6",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
            }}
          >
            <Sparkles size={22} strokeWidth={2} color="#E0A421" />
          </div>
        </div>

        {/* History toggle */}
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
          <button
            onClick={() => setShowHistory((v) => !v)}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: 6,
              padding: "8px 16px",
              borderRadius: 999,
              background: showHistory ? "#4A3F41" : "#FFFFFF",
              color: showHistory ? "#FFFFFF" : "#4A3F41",
              border: "2px solid #F1E4E8",
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            📋 履歴（{history.length}）
          </button>
        </div>

        {showHistory && (
          <div
            style={{
              borderRadius: 24,
              background: "#FFFFFF",
              boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
              padding: "22px 24px",
              marginBottom: 22,
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
              <h3 style={{ margin: 0, fontFamily: headingFont, fontSize: 16, color: "#4A3F41" }}>
                保存した履歴
              </h3>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={() => downloadHistoryCSV(history)}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1 }}
                >
                  CSVダウンロード
                </button>
                <button
                  onClick={clearAllHistory}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1, color: "#3E68C7" }}
                >
                  全部削除
                </button>
              </div>
            </div>

            {history.length === 0 ? (
              <p style={{ fontSize: 13, color: "#8C7B7E", margin: 0 }}>
                まだ保存されたプロンプトはありません。「プロンプトをコピー」すると自動で保存されます。
              </p>
            ) : (
              <div style={{ display: "grid", gap: 10 }}>
                {history.map((h) => (
                  <div key={h.id} style={{ border: "2px solid #F1E4E8", borderRadius: 14, padding: "12px 14px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                      <div style={{ fontSize: 11, color: "#B3A5A8" }}>{h.timestamp}</div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        <button onClick={() => copyHistoryEntry(h)} style={chipButtonSmall}>
                          {copiedHistoryId === h.id ? "コピー済み" : "コピー"}
                        </button>
                        <button onClick={() => deleteHistoryEntry(h.id)} style={{ ...chipButtonSmall, color: "#3E68C7" }}>
                          削除
                        </button>
                      </div>
                    </div>
                    <div style={{ fontWeight: 700, fontSize: 13, marginTop: 4, color: "#4A3F41" }}>{h.label}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Step bubbles */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", margin: "0 4px 22px" }}>
          {STEP_LABELS.map((label, i) => {
            const active = i <= step;
            const isLast = i === STEP_LABELS.length - 1;
            return (
              <React.Fragment key={label}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                  <div
                    style={{
                      width: 30,
                      height: 30,
                      borderRadius: "50%",
                      background: active ? "#5B8DEF" : "#FFFFFF",
                      border: active ? "none" : "2px solid #F1E4E8",
                      color: active ? "#FFFFFF" : "#C9BBBE",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 13,
                      fontWeight: 700,
                      boxShadow: active ? "0 3px 8px rgba(91,141,239,0.4)" : "none",
                    }}
                  >
                    {i + 1}
                  </div>
                  <div
                    style={{
                      marginTop: 6,
                      fontSize: 10.5,
                      fontWeight: active ? 700 : 500,
                      color: active ? "#4A3F41" : "#C9BBBE",
                      whiteSpace: "nowrap",
                    }}
                  >
                    {label}
                  </div>
                </div>
                {!isLast && (
                  <div
                    style={{
                      flex: 1,
                      height: 3,
                      borderRadius: 2,
                      margin: "0 4px 18px",
                      background: i < step ? "#5B8DEF" : "#F1E4E8",
                    }}
                  />
                )}
              </React.Fragment>
            );
          })}
        </div>

        {/* Card */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
            padding: "28px 26px",
            minHeight: 340,
          }}
        >
          {step === 0 && (
            <div>
              <h2 style={sectionTitle}>何を効率化したいですか？</h2>
              <p style={sectionSub}>{STEP_INTROS[0]}</p>
              <div style={{ display: "grid", gap: 10, marginTop: 18 }}>
                {PURPOSES.map((p, i) => {
                  const dots = ["#5B8DEF", "#2FB6AA", "#FFC93C", "#8C7B7E"];
                  return (
                    <button
                      key={p.id}
                      onClick={() => update("purpose", p.id)}
                      style={{
                        textAlign: "left",
                        borderRadius: 16,
                        padding: "14px 16px",
                        border:
                          s.purpose === p.id ? "2px solid #5B8DEF" : "2px solid #F1E4E8",
                        background: s.purpose === p.id ? "#E4EBFF" : "#FFFFFF",
                        cursor: "pointer",
                        fontFamily: "inherit",
                        display: "flex",
                        alignItems: "flex-start",
                        gap: 12,
                      }}
                    >
                      <span
                        style={{
                          width: 10,
                          height: 10,
                          borderRadius: "50%",
                          background: dots[i % dots.length],
                          marginTop: 5,
                          flexShrink: 0,
                        }}
                      />
                      <span>
                        <div style={{ fontWeight: 700, fontSize: 15, color: "#4A3F41" }}>{p.label}</div>
                        <div style={{ fontSize: 13, color: "#8C7B7E", marginTop: 2 }}>{p.sub}</div>
                      </span>
                    </button>
                  );
                })}
              </div>

              <div
                style={{
                  marginTop: 20,
                  borderRadius: 16,
                  background: "#FFF3D6",
                  border: "2px solid #FFE3A8",
                  padding: "14px 16px",
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A6B1F", marginBottom: 6 }}>
                  ご利用にあたって
                </div>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: "#6B5A2E", lineHeight: 1.7 }}>
                  {CAUTIONS.map((c, i) => (
                    <li key={i}>{c}</li>
                  ))}
                </ul>
              </div>
            </div>
          )}

          {step === 1 && (
            <div>
              <h2 style={sectionTitle}>背景を教えてください</h2>
              <p style={sectionSub}>{STEP_INTROS[1]}</p>

              <label style={fieldLabel}>
                今のデータの状態は？
                <HelpNote>AIに現状を伝えると、いきなり的外れな提案をされるのを防げます。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {DATA_STATES.map((d) => (
                  <button
                    key={d.id}
                    onClick={() => {
                      setDataState(d.id);
                      update("targetData", d.text);
                    }}
                    style={{ ...chip(dataState === d.id), textAlign: "left", width: "100%" }}
                  >
                    {d.label}
                  </button>
                ))}
              </div>
              <textarea
                value={s.targetData}
                onChange={(e) => update("targetData", e.target.value)}
                placeholder="選ぶと自動で入ります。自分の言葉で書き換えてもOK"
                style={{ ...textareaStyle, marginTop: 8 }}
                rows={2}
              />

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                一番のストレスは？
                <HelpNote>「何を解決したいか」がはっきりすると、AIの提案がぶれなくなります。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {STRESSES.map((st) => (
                  <button
                    key={st.id}
                    onClick={() => {
                      setMainStress(st.id);
                      update("painPoint", st.text);
                    }}
                    style={{ ...chip(mainStress === st.id), textAlign: "left", width: "100%" }}
                  >
                    {st.label}
                  </button>
                ))}
              </div>
              <textarea
                value={s.painPoint}
                onChange={(e) => update("painPoint", e.target.value)}
                placeholder="選ぶと自動で入ります。自分の言葉で書き換えてもOK"
                style={{ ...textareaStyle, marginTop: 8 }}
                rows={2}
              />

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                最終的に何が欲しいですか？（わかれば書いてください）
                <HelpNote>ここは空欄でも大丈夫。上の2つだけでも十分なプロンプトになります。</HelpNote>
              </label>
              <textarea
                value={s.desiredOutput}
                onChange={(e) => update("desiredOutput", e.target.value)}
                placeholder="例：全店舗を横並びで比較できる一覧表　※わからなければ空欄でOK"
                style={textareaStyle}
                rows={2}
              />
            </div>
          )}

          {step === 2 && (
            <div>
              <h2 style={sectionTitle}>出力条件を決めてください</h2>
              <p style={sectionSub}>{STEP_INTROS[2]}</p>

              <label style={fieldLabel}>
                回答をどんな形で受け取りたいですか？
                <HelpNote>AIの答えの「見た目」の指定です。同じ内容でも、表なのか箇条書きなのかで読みやすさが変わります。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {FORMATS.map((f) => (
                  <button
                    key={f.label}
                    onClick={() => update("outputFormat", f.label)}
                    style={{ ...chip(s.outputFormat === f.label), textAlign: "left", width: "100%" }}
                  >
                    <div style={{ fontWeight: 700 }}>{f.label}</div>
                    <div style={{ fontSize: 11.5, color: "#8C7B7E", fontWeight: 400 }}>{f.desc}</div>
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>説明のレベル</label>
              <div style={{ display: "flex", gap: 8, marginBottom: 18 }}>
                {LEVELS.map((l) => (
                  <button
                    key={l.id}
                    onClick={() => update("expertiseLevel", l.id)}
                    style={{ ...chip(s.expertiseLevel === l.id), flex: 1, textAlign: "left" }}
                  >
                    <div style={{ fontWeight: 700 }}>{l.label}</div>
                    <div style={{ fontSize: 11.5, color: "#8C7B7E", fontWeight: 400 }}>{l.desc}</div>
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>使う予定のAI（任意）</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
                {TOOLS.map((t) => (
                  <button key={t} onClick={() => update("aiTool", t)} style={chip(s.aiTool === t)}>
                    {t}
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 style={sectionTitle}>完成図面 — このままコピーして使えます</h2>
              <textarea
                ref={promptRef}
                readOnly
                value={prompt}
                onFocus={(e) => e.target.select()}
                style={{
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#3A2F35",
                  color: "#FFE9D6",
                  padding: "18px 16px",
                  fontSize: 14,
                  lineHeight: 1.7,
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  marginTop: 14,
                  border: "none",
                  borderRadius: 18,
                  resize: "vertical",
                  height: 260,
                }}
              />
              <div style={{ fontSize: 11.5, color: "#B3A5A8", marginTop: 6 }}>
                ボタンが反応しない場合は、上のテキストをタップ／クリックすると全選択されるので、Ctrl+C（Macは⌘+C）でコピーできます。
              </div>
              <button onClick={handleCopy} style={copyBtn}>
                {copied ? <Check size={15} /> : <Copy size={15} />}
                {copied ? "コピーしました" : "プロンプトをコピー"}
              </button>
              {copyFailed && (
                <div style={{ marginTop: 8, fontSize: 12, color: "#3E68C7", fontWeight: 600 }}>
                  自動コピーができませんでした。上のテキストが選択状態になっているので、Ctrl+C（Macは⌘+C）でコピーしてください。
                </div>
              )}

              <div style={{ marginTop: 24 }}>
                <label style={fieldLabel}>
                  もう一声！やっぱりここが欲しい、があれば
                  <HelpNote>あとから思いついた条件をここに書くと、末尾に「追加のお願い」として反映されます。</HelpNote>
                </label>
                <textarea
                  value={s.extraRequest}
                  onChange={(e) => update("extraRequest", e.target.value)}
                  placeholder="例：専門用語を使う場合は必ずカッコで説明を添えてほしい"
                  style={textareaStyle}
                  rows={2}
                />
              </div>

              <div style={{ marginTop: 26 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.1em", color: "#2FB6AA", fontWeight: 700, marginBottom: 10 }}>
                  ✨ この設計図に使われている工夫
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {PRINCIPLES.map((p) => (
                    <div key={p.tag} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color: "#2F52A8",
                          background: "#E4EBFF",
                          borderRadius: 999,
                          padding: "3px 10px",
                          height: "fit-content",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {p.tag}
                      </div>
                      <div style={{ fontSize: 13, color: "#4A3F41", lineHeight: 1.5 }}>{p.body}</div>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={reset} style={resetBtn}>
                <RotateCcw size={13} />
                最初からやり直す
              </button>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
          <button
            onClick={() => setStep((v) => Math.max(0, v - 1))}
            disabled={step === 0}
            style={{ ...navBtn, visibility: step === 0 ? "hidden" : "visible" }}
          >
            <ArrowLeft size={14} /> 戻る
          </button>
          {step < 3 && (
            <button
              onClick={() => setStep((v) => Math.min(3, v + 1))}
              disabled={!canNext}
              style={{ ...navBtn, opacity: canNext ? 1 : 0.4, cursor: canNext ? "pointer" : "not-allowed" }}
            >
              {step === 2 ? "設計図を完成させる" : "次へ"} <ArrowRight size={14} />
            </button>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 32, fontSize: 11.5, color: "#B3A5A8" }}>
          <a
            href="https://note.com/cleaning3104"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: "#8C7B7E", textDecoration: "none", fontWeight: 700 }}
          >
            PROMPT LAB
          </a>{" "}
          by さとぽん
          <span style={{ margin: "0 6px" }}>·</span>
          <button
            onClick={() => setShowChangelog((v) => !v)}
            style={{
              background: "none",
              border: "none",
              color: "#B3A5A8",
              textDecoration: "underline",
              fontSize: 11.5,
              cursor: "pointer",
              fontFamily: "inherit",
              padding: 0,
            }}
          >
            ver.{VERSION}（更新履歴）
          </button>
        </div>

        {showChangelog && (
          <div
            style={{
              marginTop: 12,
              background: "#FFFFFF",
              borderRadius: 16,
              padding: "16px 18px",
              boxShadow: "0 4px 14px rgba(0,0,0,0.06)",
              maxWidth: 420,
              marginLeft: "auto",
              marginRight: "auto",
            }}
          >
            <div style={{ fontSize: 11, fontWeight: 700, color: "#8C7B7E", marginBottom: 8 }}>更新履歴</div>
            <div style={{ display: "grid", gap: 8 }}>
              {CHANGELOG.map((c) => (
                <div key={c.version} style={{ fontSize: 12, color: "#4A3F41", lineHeight: 1.5 }}>
                  <span style={{ fontWeight: 700 }}>v{c.version}</span>
                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const COLORS = {
  bg: "#FFF6EE",
  card: "#FFFFFF",

  inkSoft: "#8C7B7E",
  pink: "#5B8DEF",
  pinkSoft: "#E4EBFF",
  mint: "#2FB6AA",
  mintSoft: "#DFF7F4",
  yellow: "#FFC93C",
  yellowSoft: "#FFF3D6",

  "'Zen Maru Gothic', 'Hiragino Maru Gothic ProN', 'UD Digi Kyokasho NK-R', 'Yu Gothic', sans-serif";

  fontSize: 20,
  fontWeight: 700,
  color: COLORS.ink,
};

  margin: "6px 0 0",
  fontSize: 13,

  display: "block",
  fontSize: 13,
  fontWeight: 700,
  color: COLORS.ink,
  margin: "18px 0 8px",

const textareaStyle = {
  width: "100%",
  border: `2px solid ${COLORS.pinkSoft}`,

  border: active ? `2px solid ${COLORS.pink}` : `2px solid #F1E4E8`,
  background: active ? COLORS.pinkSoft : "#FFFFFF",
  color: active ? "#2F52A8" : COLORS.ink,
  fontWeight: active ? 700 : 500,
  cursor: "pointer",
  fontFamily: "inherit",
});

const copyBtn = {
  marginTop: 14,
  display: "inline-flex",
  alignItems: "center",
  gap: 8,
  padding: "12px 22px",
  borderRadius: 999,
  background: COLORS.pink,
  color: "#FFFFFF",
  border: "none",
  fontSize: 14,
  fontWeight: 700,
  cursor: "pointer",
  boxShadow: "0 4px 0 #3E68C7",
};

  marginTop: 22,
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "9px 16px",
  borderRadius: 999,
  background: "#FFFFFF",
  color: COLORS.inkSoft,
  border: "2px solid #F1E4E8",
  fontSize: 12.5,
  cursor: "pointer",
};

const navBtn = {
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "11px 22px",
  borderRadius: 999,
  background: COLORS.ink,
  color: "#FFFFFF",
  border: "none",
  fontSize: 13.5,
  fontWeight: 700,
  cursor: "pointer",
  boxShadow: "0 4px 0 #2E2628",
};

const chipButtonSmall = {
  padding: "6px 12px",
  borderRadius: 999,
  border: "1.5px solid #F1E4E8",
  background: "#FFFFFF",
  color: COLORS.ink,
  fontSize: 11.5,
  fontWeight: 700,
  cursor: "pointer",
  fontFamily: "inherit",
  whiteSpace: "nowrap",
};

ReactDOM.createRoot(document.getElementById("root")).render(<PromptBlueprint />);

</script>

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
