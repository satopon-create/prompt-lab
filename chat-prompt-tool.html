<script>
  // ここを好きな合言葉に変更してください
  const CORRECT_PASSWORD = "yukkuri";

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_chat", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_unlocked_chat") === "1") {
    unlock();
  }
</script>

function buildPrompt(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const mood = MOODS.find((m) => m.id === s.mood);
  const responseType = RESPONSE_TYPES.find((r) => r.id === s.responseType);
  const role = ROLES.find((r) => r.id === s.role);
  const situation = s.situation || "（相談内容が未記入です。話せる範囲で状況を書いてください）";

  const lines = [];
  lines.push(`あなたは${role ? role.position : "信頼できる相談相手"}として、私の相談に乗ってください。`);
  if (role) lines.push(role.tone);
  lines.push("");
  lines.push("【状況】");
  lines.push(situation);
  if (mood) lines.push(`今の気持ち：${mood.text}`);
  if (s.tried) lines.push(`既に試したこと：${s.tried}`);
  lines.push("");
  lines.push("【希望する関わり方】");
  lines.push(responseType ? responseType.text : "率直な意見を伝えてください");
  if (s.constraints) lines.push(`譲れない条件・価値観：${s.constraints}`);
  lines.push("");
  lines.push("【回答の仕方】");
  lines.push(`・${s.length || "じっくり丁寧に"}話してください`);
  if (s.avoidWords) lines.push(`・次のような言い方は避けてください：${s.avoidWords}`);
  lines.push("・質問がある場合は、一度に1〜2個までにしてください（質問攻めにしないでください）");
  lines.push("・不明な点があれば、先に質問してから進めてください");

  let body = lines.join("\n");

  if (s.extraRequest) {
    body += `\n\n【追加のお願い】\n${s.extraRequest}`;
  }

  return body;
}

const HISTORY_KEY = "promptlab_chat_history";
const HISTORY_LIMIT = 100;

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `chat-prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHistoryLabel(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const detail = s.situation || "";
  const label = `${purpose ? purpose.label : "なんでも相談"} / ${detail}`.trim();
  return label.length > 60 ? label.slice(0, 60) + "…" : label;
}

const GAS_LOG_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

function logToAdminSheet(toolName, label, promptText) {
  if (!GAS_LOG_URL) return;
  try {
    fetch(GAS_LOG_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        tool: toolName,
        label,
        prompt: promptText,
      }),
    }).catch(() => {});
  } catch (e) {}
}

function ChatPromptTool() {
  const [step, setStep] = useState(0);
  const TUTORIAL_KEY = HISTORY_KEY + "_tutorial_seen";
  const [showTutorial, setShowTutorial] = useState(() => {
    try {
      return localStorage.getItem(TUTORIAL_KEY) !== "1";
    } catch (e) {
      return true;
    }
  });
  const dismissTutorial = () => {
    setShowTutorial(false);
    try {
      localStorage.setItem(TUTORIAL_KEY, "1");
    } catch (e) {}
  };
  const [copied, setCopied] = useState(false);
  const [copyFailed, setCopyFailed] = useState(false);
  const [moodId, setMoodId] = useState("");
  const [responseTypeId, setResponseTypeId] = useState("");
  const [roleId, setRoleId] = useState("");
  const [s, setS] = useState({
    purpose: "",
    situation: "",
    mood: "",
    tried: "",
    responseType: "",
    role: "",
    constraints: "",
    length: "",
    avoidWords: "",
    extraRequest: "",
  });

  const update = (k, v) => setS((prev) => ({ ...prev, [k]: v }));
  const canNext = step === 0 ? !!s.purpose : true;
  const prompt = buildPrompt(s);
  const promptRef = React.useRef(null);

  const [history, setHistoryState] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch (e) {
      return [];
    }
  });
  const setHistory = (updater) => {
    setHistoryState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      } catch (e) {}
      return next;
    });
  };
  const [showHistory, setShowHistory] = useState(false);
  const [showChangelog, setShowChangelog] = useState(false);
  const [copiedHistoryId, setCopiedHistoryId] = useState(null);

  const addHistoryEntry = (label, promptText) => {
    const entry = {
      id: Date.now().toString(),
      timestamp: new Date().toLocaleString("ja-JP"),
      label,
      prompt: promptText,
    };
    setHistory((prev) => [entry, ...prev].slice(0, HISTORY_LIMIT));
  };
  const deleteHistoryEntry = (id) => setHistory((prev) => prev.filter((h) => h.id !== id));
  const clearAllHistory = () => {
    if (window.confirm("保存した履歴をすべて削除します。よろしいですか？")) {
      setHistory([]);
    }
  };
  const copyHistoryEntry = async (h) => {
    const ok = await copyText(h.prompt);
    if (ok) {
      setCopiedHistoryId(h.id);
      setTimeout(() => setCopiedHistoryId(null), 1500);
    }
  };

  const handleCopy = async () => {
    setCopyFailed(false);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(prompt);
        setCopied(true);
        addHistoryEntry(buildHistoryLabel(s), prompt);
        logToAdminSheet("なんでも相談", buildHistoryLabel(s), prompt);
        setTimeout(() => setCopied(false), 1800);
        return;
      }
    } catch (e) {}
    try {
      const el = promptRef.current;
      if (el) {
        el.focus();
        el.select();
        el.setSelectionRange(0, prompt.length);
        const ok = document.execCommand && document.execCommand("copy");
        if (ok) {
          setCopied(true);
          addHistoryEntry(buildHistoryLabel(s), prompt);
          logToAdminSheet("なんでも相談", buildHistoryLabel(s), prompt);
          setTimeout(() => setCopied(false), 1800);
          return;
        }
      }
    } catch (e) {}
    setCopyFailed(true);
  };

  const reset = () => {
    setS({
      purpose: "",
      situation: "",
      mood: "",
      tried: "",
      responseType: "",
      role: "",
      constraints: "",
      length: "",
      avoidWords: "",
      extraRequest: "",

    setResponseTypeId("");
    setRoleId("");
    setStep(0);
  };

  return (
    <div
      style={{
        minHeight: "100vh",
        background: COLORS.bg,
        backgroundImage:
          "radial-gradient(circle at 12% 12%, #FFE3EA 0%, transparent 38%), radial-gradient(circle at 88% 85%, #DFF7F4 0%, transparent 38%), radial-gradient(circle at 90% 8%, #FFF3D6 0%, transparent 30%)",
        fontFamily: "'Hiragino Sans', 'Yu Gothic', -apple-system, BlinkMacSystemFont, sans-serif",
        color: COLORS.ink,
        padding: "32px 16px 64px",
      }}
    >
      <style>{"@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');"}</style>

      {showTutorial && (
        <div
          style={{
            position: "fixed",
            inset: 0,
            background: "rgba(74,63,65,0.55)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            zIndex: 50,
            padding: 16,
          }}
        >
          <div
            style={{
              background: "#FFFFFF",
              borderRadius: 24,
              padding: "28px 26px",
              maxWidth: 400,
              width: "100%",
              boxShadow: "0 12px 30px rgba(0,0,0,0.25)",
            }}
          >
            <div
              style={{
                display: "inline-block",
                fontSize: 11,
                letterSpacing: "0.1em",
                color: "#C7315A",
                background: COLORS.pinkSoft,
                borderRadius: 999,
                padding: "3px 10px",
                fontWeight: 700,
                marginBottom: 10,
              }}
            >
              はじめての方へ
            </div>
            <h2 style={{ margin: "0 0 14px", fontFamily: headingFont, fontSize: 19, color: COLORS.ink }}>
              使い方はかんたん5ステップ
            </h2>
            <div style={{ display: "grid", gap: 10, marginBottom: 16 }}>
              {[
                ["1", "相談の種類を選ぶ"],
                ["2", "状況・今の気持ちを教える"],
                ["3", "どう答えてほしいかを選ぶ"],
                ["4", "回答の長さなど仕上げ条件を選ぶ"],
                ["5", "完成したプロンプトをコピーして、ChatGPTやClaudeに貼り付ける"],
              ].map(([n, t]) => (
                <div key={n} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                  <span
                    style={{
                      width: 22,
                      height: 22,
                      borderRadius: "50%",
                      background: COLORS.pink,
                      color: "#FFFFFF",
                      fontSize: 12,
                      fontWeight: 700,
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      flexShrink: 0,
                    }}
                  >
                    {n}
                  </span>
                  <div style={{ fontSize: 13.5, color: COLORS.ink, lineHeight: 1.5, paddingTop: 1 }}>{t}</div>
                </div>
              ))}
            </div>
            <p style={{ fontSize: 12, color: COLORS.inkSoft, margin: "0 0 18px" }}>
              わからない項目は空欄のままでも大丈夫です。あとから「戻る」でいつでも修正できます。
            </p>
            <button
              onClick={dismissTutorial}
              style={{
                width: "100%",
                padding: "12px",
                borderRadius: 999,
                background: COLORS.pink,
                color: "#FFFFFF",
                border: "none",
                fontSize: 14,
                fontWeight: 700,
                cursor: "pointer",
                fontFamily: "inherit",
                boxShadow: "0 4px 0 #D14F71",
              }}
            >
              はじめる
            </button>
          </div>
        </div>
      )}

      <div style={{ maxWidth: 720, margin: "0 auto" }}>
        {/* Title block */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
            padding: "20px 24px",
            marginBottom: 22,
            display: "flex",
            alignItems: "center",
            justifyContent: "space-between",
          }}
        >
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 8, marginBottom: 8, flexWrap: "wrap" }}>
              <span style={{ fontFamily: headingFont, fontSize: 16, fontWeight: 900, letterSpacing: "0.02em", color: "#C7315A" }}>
                PROMPT LAB
              </span>
              <span style={{ fontSize: 11, color: COLORS.inkSoft, fontWeight: 500 }}>by さとぽん</span>
            </div>
            <h1
              style={{
                margin: 0,
                fontFamily: headingFont,
                fontSize: 22,
                fontWeight: 700,
                letterSpacing: "-0.01em",
                lineHeight: 1.4,
                color: COLORS.ink,
              }}
            >
              なんでも相談
              <br />
              プロンプト設計ツール
            </h1>
          </div>
          <div
            style={{
              width: 44,
              height: 44,
              borderRadius: "50%",
              background: "#FFF3D6",
              display: "flex",
              alignItems: "center",
              justifyContent: "center",
              flexShrink: 0,
            }}
          >
            <Sparkles size={22} strokeWidth={2} color="#E0A421" />
          </div>
        </div>

        {/* History toggle */}
        <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
          <button
            onClick={() => setShowHistory((v) => !v)}
            style={{
              display: "inline-flex",
              alignItems: "center",
              gap: 6,
              padding: "8px 16px",
              borderRadius: 999,
              background: showHistory ? COLORS.ink : "#FFFFFF",
              color: showHistory ? "#FFFFFF" : COLORS.ink,
              border: "2px solid #F1E4E8",
              fontSize: 12.5,
              fontWeight: 700,
              cursor: "pointer",
              fontFamily: "inherit",
            }}
          >
            📋 履歴（{history.length}）
          </button>
        </div>

        {showHistory && (
          <div
            style={{
              borderRadius: 24,
              background: "#FFFFFF",
              boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
              padding: "22px 24px",
              marginBottom: 22,
            }}
          >
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14, flexWrap: "wrap", gap: 8 }}>
              <h3 style={{ margin: 0, fontFamily: headingFont, fontSize: 16, color: COLORS.ink }}>保存した履歴</h3>
              <div style={{ display: "flex", gap: 8 }}>
                <button
                  onClick={() => downloadHistoryCSV(history)}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1 }}
                >
                  CSVダウンロード
                </button>
                <button
                  onClick={clearAllHistory}
                  disabled={history.length === 0}
                  style={{ ...chipButtonSmall, opacity: history.length === 0 ? 0.4 : 1, color: "#D14F71" }}
                >
                  全部削除
                </button>
              </div>
            </div>

            {history.length === 0 ? (
              <p style={{ fontSize: 13, color: COLORS.inkSoft, margin: 0 }}>
                まだ保存されたプロンプトはありません。「プロンプトをコピー」すると自動で保存されます。
              </p>
            ) : (
              <div style={{ display: "grid", gap: 10 }}>
                {history.map((h) => (
                  <div key={h.id} style={{ border: "2px solid #F1E4E8", borderRadius: 14, padding: "12px 14px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", gap: 8 }}>
                      <div style={{ fontSize: 11, color: "#B3A5A8" }}>{h.timestamp}</div>
                      <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                        <button onClick={() => copyHistoryEntry(h)} style={chipButtonSmall}>
                          {copiedHistoryId === h.id ? "コピー済み" : "コピー"}
                        </button>
                        <button onClick={() => deleteHistoryEntry(h.id)} style={{ ...chipButtonSmall, color: "#D14F71" }}>
                          削除
                        </button>
                      </div>
                    </div>
                    <div style={{ fontWeight: 700, fontSize: 13, marginTop: 4, color: COLORS.ink }}>{h.label}</div>
                  </div>
                ))}
              </div>
            )}
          </div>
        )}

        {/* Step bubbles */}
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", margin: "0 4px 22px" }}>
          {STEP_LABELS.map((label, i) => {
            const active = i <= step;
            const isLast = i === STEP_LABELS.length - 1;
            return (
              <React.Fragment key={label}>
                <div style={{ display: "flex", flexDirection: "column", alignItems: "center" }}>
                  <div
                    style={{
                      width: 30,
                      height: 30,
                      borderRadius: "50%",
                      background: active ? COLORS.pink : "#FFFFFF",
                      border: active ? "none" : "2px solid #F1E4E8",
                      color: active ? "#FFFFFF" : "#C9BBBE",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      fontSize: 13,
                      fontWeight: 700,
                      boxShadow: active ? "0 3px 8px rgba(255,111,145,0.4)" : "none",
                    }}
                  >
                    {i + 1}
                  </div>
                  <div
                    style={{
                      marginTop: 6,
                      fontSize: 10.5,
                      fontWeight: active ? 700 : 500,
                      color: active ? COLORS.ink : "#C9BBBE",
                      whiteSpace: "nowrap",
                    }}
                  >
                    {label}
                  </div>
                </div>
                {!isLast && (
                  <div
                    style={{
                      flex: 1,
                      height: 3,
                      borderRadius: 2,
                      margin: "0 4px 18px",
                      background: i < step ? COLORS.pink : "#F1E4E8",
                    }}
                  />
                )}
              </React.Fragment>
            );
          })}
        </div>

        {/* Card */}
        <div
          style={{
            borderRadius: 24,
            background: "#FFFFFF",
            boxShadow: "0 6px 20px rgba(74,63,65,0.08)",
            padding: "28px 26px",
            minHeight: 340,
          }}
        >
          {step === 0 && (
            <div>
              <h2 style={sectionTitle}>どんなご相談ですか？</h2>
              <p style={sectionSub}>{STEP_INTROS[0]}</p>
              <div style={{ display: "grid", gap: 10, marginTop: 18 }}>
                {PURPOSES.map((p, i) => {
                  const dots = ["#FF6F91", "#2FB6AA", "#FFC93C", "#8C7B7E", "#FF6F91", "#2FB6AA", "#FFC93C"];
                  return (
                    <button
                      key={p.id}
                      onClick={() => update("purpose", p.id)}
                      style={{
                        textAlign: "left",
                        borderRadius: 16,
                        padding: "14px 16px",
                        border: s.purpose === p.id ? `2px solid ${COLORS.pink}` : "2px solid #F1E4E8",
                        background: s.purpose === p.id ? COLORS.pinkSoft : "#FFFFFF",
                        cursor: "pointer",
                        fontFamily: "inherit",
                        display: "flex",
                        alignItems: "flex-start",
                        gap: 12,
                      }}
                    >
                      <span
                        style={{
                          width: 10,
                          height: 10,
                          borderRadius: "50%",
                          background: dots[i % dots.length],
                          marginTop: 5,
                          flexShrink: 0,
                        }}
                      />
                      <span>
                        <div style={{ fontWeight: 700, fontSize: 15, color: COLORS.ink }}>{p.label}</div>
                        <div style={{ fontSize: 13, color: COLORS.inkSoft, marginTop: 2 }}>{p.sub}</div>
                      </span>
                    </button>
                  );
                })}
              </div>

              <div
                style={{
                  marginTop: 20,
                  borderRadius: 16,
                  background: "#FFF3D6",
                  border: "2px solid #FFE3A8",
                  padding: "14px 16px",
                }}
              >
                <div style={{ fontSize: 12, fontWeight: 700, color: "#8A6B1F", marginBottom: 6 }}>ご利用にあたって</div>
                <ul style={{ margin: 0, paddingLeft: 18, fontSize: 12, color: "#6B5A2E", lineHeight: 1.7 }}>
                  {CAUTIONS.map((c, i) => (
                    <li key={i}>{c}</li>
                  ))}
                </ul>
              </div>
            </div>
          )}

          {step === 1 && (
            <div>
              <h2 style={sectionTitle}>今の状況を教えてください</h2>
              <p style={sectionSub}>{STEP_INTROS[1]}</p>

              <label style={fieldLabel}>
                どんな状況ですか？
                <HelpNote>話せる範囲でOKです。具体的なほど、的確な相談相手になってもらえます。</HelpNote>
              </label>
              <textarea
                value={s.situation}
                onChange={(e) => update("situation", e.target.value)}
                placeholder="例：職場の先輩と意見が合わず、最近話すのがしんどい"
                style={textareaStyle}
                rows={3}
              />

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                今の気持ちは？
                <HelpNote>感情を先に伝えることで、いきなり正論を並べられるすれ違いを防げます。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {MOODS.map((m) => (
                  <button
                    key={m.id}
                    onClick={() => {
                      setMoodId(m.id);
                      update("mood", m.id);
                    }}
                    style={{ ...chip(moodId === m.id), textAlign: "left", width: "100%" }}
                  >
                    {m.label}
                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                すでに試したことがあれば
                <HelpNote>同じ提案を繰り返されるのを防げます。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.tried}
                onChange={(e) => update("tried", e.target.value)}
                placeholder="例：一度、本人に直接気持ちを伝えてみたが変わらなかった"
                style={textareaStyle}
                rows={2}
              />
            </div>
          )}

          {step === 2 && (
            <div>
              <h2 style={sectionTitle}>どう答えてほしいですか？</h2>
              <p style={sectionSub}>{STEP_INTROS[2]}</p>

              <label style={fieldLabel}>
                求めているのは？
                <HelpNote>ここを伝えないと、AIは大抵すぐアドバイスモードに入ってしまいます。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {RESPONSE_TYPES.map((r) => (
                  <button
                    key={r.id}
                    onClick={() => {
                      setResponseTypeId(r.id);
                      update("responseType", r.id);
                    }}
                    style={{ ...chip(responseTypeId === r.id), textAlign: "left", width: "100%" }}
                  >
                    {r.label}
                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                どんな立場で答えてほしいですか？
                <HelpNote>友人・メンター・あえて厳しい役、など立場を指定すると、求めている温度感の回答が返ってきやすくなります。</HelpNote>
              </label>
              <div style={{ display: "grid", gap: 8 }}>
                {ROLES.map((r) => (
                  <button
                    key={r.id}
                    onClick={() => {
                      setRoleId(r.id);
                      update("role", r.id);
                    }}
                    style={{ ...chip(roleId === r.id), textAlign: "left", width: "100%" }}
                  >
                    {r.label}
                  </button>
                ))}
              </div>

              <label style={{ ...fieldLabel, marginTop: 22 }}>
                譲れない条件・価値観があれば
                <HelpNote>例えば「仕事は辞めたくない」など。伝えておくと、的外れな提案を避けられます。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.constraints}
                onChange={(e) => update("constraints", e.target.value)}
                placeholder="例：転職は考えていない、今の人間関係を大きく変えたくない"
                style={textareaStyle}
                rows={2}
              />
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 style={sectionTitle}>仕上げ条件を決めてください</h2>
              <p style={sectionSub}>{STEP_INTROS[3]}</p>

              <label style={fieldLabel}>回答の長さ・熱量</label>
              <div style={{ display: "grid", gap: 8, marginBottom: 18 }}>
                {LENGTHS.map((l) => (
                  <button
                    key={l.label}
                    onClick={() => update("length", l.label)}
                    style={{ ...chip(s.length === l.label), textAlign: "left", width: "100%" }}
                  >
                    <div style={{ fontWeight: 700 }}>{l.label}</div>
                    <div style={{ fontSize: 11.5, color: COLORS.inkSoft, fontWeight: 400 }}>{l.desc}</div>
                  </button>
                ))}
              </div>

              <label style={fieldLabel}>
                言われたくない言い方があれば
                <HelpNote>「考えすぎだよ」のような、無神経に感じる言葉を事前に避けられます。空欄でもOKです。</HelpNote>
              </label>
              <textarea
                value={s.avoidWords}
                onChange={(e) => update("avoidWords", e.target.value)}
                placeholder="例：気にしすぎ、考えすぎ、といった言葉は避けてほしい"
                style={textareaStyle}
                rows={2}
              />
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 style={sectionTitle}>完成プロンプト — このままコピーして使えます</h2>
              <textarea
                ref={promptRef}
                readOnly
                value={prompt}
                onFocus={(e) => e.target.select()}
                style={{
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#3A2F35",
                  color: "#FFE9D6",
                  padding: "18px 16px",
                  fontSize: 14,
                  lineHeight: 1.7,
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  marginTop: 14,
                  border: "none",
                  borderRadius: 18,
                  resize: "vertical",
                  height: 260,
                }}
              />
              <div style={{ fontSize: 11.5, color: "#B3A5A8", marginTop: 6 }}>
                ボタンが反応しない場合は、上のテキストをタップ／クリックすると全選択されるので、Ctrl+C（Macは⌘+C）でコピーできます。
              </div>
              <button onClick={handleCopy} style={copyBtn}>
                {copied ? <Check size={15} /> : <Copy size={15} />}
                {copied ? "コピーしました" : "プロンプトをコピー"}
              </button>
              {copyFailed && (
                <div style={{ marginTop: 8, fontSize: 12, color: "#D14F71", fontWeight: 600 }}>
                  自動コピーができませんでした。上のテキストが選択状態になっているので、Ctrl+C（Macは⌘+C）でコピーしてください。
                </div>
              )}

              <div style={{ marginTop: 24 }}>
                <label style={fieldLabel}>
                  もう一声！やっぱりここが欲しい、があれば
                  <HelpNote>あとから思いついた条件をここに書くと、末尾に「追加のお願い」として反映されます。</HelpNote>
                </label>
                <textarea
                  value={s.extraRequest}
                  onChange={(e) => update("extraRequest", e.target.value)}
                  placeholder="例：具体的な行動プランも一緒に提案してほしい"
                  style={textareaStyle}
                  rows={2}
                />
              </div>

              <div style={{ marginTop: 26 }}>
                <div style={{ fontSize: 11, letterSpacing: "0.1em", color: COLORS.mint, fontWeight: 700, marginBottom: 10 }}>
                  ✨ この設計図に使われている工夫
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {PRINCIPLES.map((p) => (
                    <div key={p.tag} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color: "#C7315A",
                          background: COLORS.pinkSoft,
                          borderRadius: 999,
                          padding: "3px 10px",
                          height: "fit-content",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {p.tag}
                      </div>
                      <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{p.body}</div>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={reset} style={resetBtn}>
                <RotateCcw size={13} />
                最初からやり直す
              </button>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
          <button
            onClick={() => setStep((v) => Math.max(0, v - 1))}
            disabled={step === 0}
            style={{ ...navBtn, visibility: step === 0 ? "hidden" : "visible" }}
          >
            <ArrowLeft size={14} /> 戻る
          </button>
          {step < 4 && (
            <button
              onClick={() => setStep((v) => Math.min(4, v + 1))}
              disabled={!canNext}
              style={{ ...navBtn, opacity: canNext ? 1 : 0.4, cursor: canNext ? "pointer" : "not-allowed" }}
            >
              {step === 3 ? "プロンプトを完成させる" : "次へ"} <ArrowRight size={14} />
            </button>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 32, fontSize: 11.5, color: "#B3A5A8" }}>
          <a
            href="https://note.com/cleaning3104"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: "#C7315A", textDecoration: "none", fontWeight: 700 }}
          >
            PROMPT LAB
          </a>{" "}
          by さとぽん
          <span style={{ margin: "0 6px" }}>·</span>
          <button
            onClick={() => setShowChangelog((v) => !v)}
            style={{
              background: "none",
              border: "none",
              color: "#B3A5A8",
              textDecoration: "underline",
              fontSize: 11.5,
              cursor: "pointer",
              fontFamily: "inherit",
              padding: 0,
            }}
          >
            ver.{VERSION}（更新履歴）
          </button>
        </div>

        {showChangelog && (
          <div
            style={{
              marginTop: 12,
              background: "#FFFFFF",
              borderRadius: 16,
              padding: "16px 18px",
              boxShadow: "0 4px 14px rgba(0,0,0,0.06)",
              maxWidth: 420,
              marginLeft: "auto",
              marginRight: "auto",
            }}
          >
            <div style={{ fontSize: 11, fontWeight: 700, color: "#C7315A", marginBottom: 8 }}>更新履歴</div>
            <div style={{ display: "grid", gap: 8 }}>
              {CHANGELOG.map((c) => (
                <div key={c.version} style={{ fontSize: 12, color: "#4A3F41", lineHeight: 1.5 }}>
                  <span style={{ fontWeight: 700 }}>v{c.version}</span>
                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
