<div id="gate">

    <h1>合言葉を入力してください</h1>
    <input type="password" id="gate-input" placeholder="合言葉" autocomplete="off" />
    <button id="gate-btn">開く</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div id="root" style="display:none"></div>

<script>
  // ここを好きな合言葉に変更してください
  const CORRECT_PASSWORD = "monogatari";

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_writing", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_unlocked_writing") === "1") {
    unlock();
  }
</script>

<script>
  window.addEventListener("error", function (e) {
    const rootEl = document.getElementById("root");
    const gateEl = document.getElementById("gate");
    if (rootEl && !rootEl.innerHTML) {
      if (gateEl) gateEl.style.display = "none";
      rootEl.style.display = "block";
      rootEl.innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラー: " +
        (e && e.message ? e.message : "詳細不明のエラー") +
        "<br>ファイルまたはネットワーク（社内フィルタ・拡張機能など）が原因の可能性があります。</div>";
    }
  });
</script>

function buildPrompt(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const reader = READERS.find((r) => r.id === s.reader);
  const goal = GOALS.find((g) => g.id === s.goal);
  const tone = TONES.find((t) => t.id === s.tone);
  const topic = s.topic || "（内容が未記入です。書きたいことを具体的に書いてください）";

  const lines = [];
  lines.push(`あなたはプロの${purpose ? purpose.label : "文章"}のライターです。`);
  lines.push("");
  lines.push("【書きたい内容】");
  lines.push(topic);
  if (reader) lines.push(`読者層：${reader.text}`);
  lines.push("");
  lines.push("【ゴール】");
  lines.push(goal ? goal.text : "内容が正しく伝わることを重視してください");
  lines.push("");
  lines.push("【トーン・文体】");
  lines.push(`・トーン：${tone ? tone.text : "自然で読みやすいトーン"}`);
  if (s.person && s.person !== "指定しない") lines.push(`・一人称：${s.person}`);
  if (s.length && s.length !== "指定しない") lines.push(`・文字数の目安：${s.length}（大きく超えないようにしてください）`);
  lines.push("");
  lines.push("【構成】");
  lines.push(s.structure || "内容に合わせて読みやすい構成にしてください");
  if (s.avoidWords) lines.push(`避けたい表現・NGワード：${s.avoidWords}`);
  if (s.keywords) lines.push(`意識してほしいキーワード：${s.keywords}`);
  if (s.wantHashtags) {
    lines.push("");
    lines.push("【ハッシュタグ】");
    lines.push("投稿文の最後に、内容に関連するハッシュタグを10〜15個つけてください（#○○の形式で、日本語・英語どちらでも読者に伝わりやすいものを選んでください）。");
  }
  lines.push("");
  lines.push("不明な点があれば、先に質問してください（一度に1〜2個までにしてください）。");

  let body = lines.join("\n");

  if (s.extraRequest) {
    body += `\n\n【追加のお願い】\n${s.extraRequest}`;
  }

  return body;
}

const HISTORY_KEY = "promptlab_writing_history";
const HISTORY_LIMIT = 100;

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `writing-prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function buildHistoryLabel(s) {
  const purpose = PURPOSES.find((p) => p.id === s.purpose);
  const detail = s.topic || "";
  const label = `${purpose ? purpose.label : "文章作成"} / ${detail}`.trim();
  return label.length > 60 ? label.slice(0, 60) + "…" : label;
}

// ここに、GASを「ウェブアプリとしてデプロイ」した後のURLを貼り付けてください。

const GAS_LOG_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"

function logToAdminSheet(toolName, label, promptText) {
  if (!GAS_LOG_URL) return;
  try {
    fetch(GAS_LOG_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        timestamp: new Date().toLocaleString("ja-JP"),
        tool: toolName,
        label,
        prompt: promptText,
      }),
    }).catch(() => {});
  } catch (e) {}
}

function WritingPromptTool() {
  const [step, setStep] = useState(0);
  const TUTORIAL_KEY = HISTORY_KEY + "_tutorial_seen";
  const [showTutorial, setShowTutorial] = useState(() => {
    try {
      return localStorage.getItem(TUTORIAL_KEY) !== "1";
    } catch (e) {
      return true;
    }
  });
  const dismissTutorial = () => {
    setShowTutorial(false);
    try {
      localStorage.setItem(TUTORIAL_KEY, "1");
    } catch (e) {}
  };
  const [copied, setCopied] = useState(false);
  const [copyFailed, setCopyFailed] = useState(false);
  const [readerId, setReaderId] = useState("");
  const [goalId, setGoalId] = useState("");
  const [toneId, setToneId] = useState("");
  const [s, setS] = useState({
    purpose: "",
    topic: "",
    reader: "",
    goal: "",
    tone: "",
    person: "",
    length: "",
    structure: "",
    avoidWords: "",
    keywords: "",
    wantHashtags: false,
    extraRequest: "",
  });

  const update = (k, v) => setS((prev) => ({ ...prev, [k]: v }));
  const canNext = step === 0 ? !!s.purpose : true;
  const prompt = buildPrompt(s);
  const promptRef = React.useRef(null);

  const [history, setHistoryState] = useState(() => {
    try {
      return JSON.parse(localStorage.getItem(HISTORY_KEY) || "[]");
    } catch (e) {
      return [];
    }
  });
  const setHistory = (updater) => {
    setHistoryState((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      try {
        localStorage.setItem(HISTORY_KEY, JSON.stringify(next));
      } catch (e) {}
      return next;
    });
  };
  const [showHistory, setShowHistory] = useState(false);
  const [showChangelog, setShowChangelog] = useState(false);
  const [copiedHistoryId, setCopiedHistoryId] = useState(null);

  const addHistoryEntry = (label, promptText) => {
    const entry = {
      id: Date.now().toString(),
      timestamp: new Date().toLocaleString("ja-JP"),
      label,
      prompt: promptText,
    };
    setHistory((prev) => [entry, ...prev].slice(0, HISTORY_LIMIT));
  };
  const deleteHistoryEntry = (id) => setHistory((prev) => prev.filter((h) => h.id !== id));
  const clearAllHistory = () => {
    if (window.confirm("保存した履歴をすべて削除します。よろしいですか？")) {
      setHistory([]);
    }
  };
  const copyHistoryEntry = async (h) => {
    const ok = await copyText(h.prompt);
    if (ok) {
      setCopiedHistoryId(h.id);
      setTimeout(() => setCopiedHistoryId(null), 1500);
    }
  };

  const handleCopy = async () => {
    setCopyFailed(false);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(prompt);
        setCopied(true);
        addHistoryEntry(buildHistoryLabel(s), prompt);
        logToAdminSheet("文章作成", buildHistoryLabel(s), prompt);
        setTimeout(() => setCopied(false), 1800);
        return;
      }
    } catch (e) {}
    try {
      const el = promptRef.current;
      if (el) {
        el.focus();
        el.select();
        el.setSelectionRange(0, prompt.length);
        const ok = document.execCommand && document.execCommand("copy");
        if (ok) {
          setCopied(true);
          addHistoryEntry(buildHistoryLabel(s), prompt);
          logToAdminSheet("文章作成", buildHistoryLabel(s), prompt);
          setTimeout(() => setCopied(false), 1800);
          return;
        }
      }
    } catch (e) {}
    setCopyFailed(true);
  };

  const reset = () => {
    setS({
      purpose: "",
      topic: "",
      reader: "",
      goal: "",
      tone: "",
      person: "",
      length: "",
      structure: "",
      avoidWords: "",
      keywords: "",
      wantHashtags: false,
      extraRequest: "",
    });
    setReaderId("");
    setGoalId("");
    setToneId("");
    setStep(0);
  };

    <div
      style={{
        minHeight: "100vh",
        background: COLORS.bg,
        backgroundImage:
          "radial-gradient(circle at 12% 12%, #DFF4E9 0%, transparent 38%), radial-gradient(circle at 88% 85%, #DFF7F4 0%, transparent 38%), radial-gradient(circle at 90% 8%, #FFF3D6 0%, transparent 30%)",
        fontFamily: "'Hiragino Sans', 'Yu Gothic', -apple-system, BlinkMacSystemFont, sans-serif",
        color: COLORS.ink,
        padding: "32px 16px 64px",
      }}
    >
      <style>{"@import url('https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap');"}</style>

      {showTutorial && (
        <div
          style={{
            position: "fixed",

                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
