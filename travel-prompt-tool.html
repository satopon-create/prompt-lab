<script>
  // ここを好きな合言葉に変更してください
  const CORRECT_PASSWORD = "niji";

  function unlock() {
    document.getElementById("gate").style.display = "none";
    document.getElementById("root").style.display = "block";
    sessionStorage.setItem("pb_unlocked_travel", "1");
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === CORRECT_PASSWORD) {
      unlock();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_unlocked_travel") === "1") {
    unlock();
  }
</script>

function buildPrompt(s) {
  const transport = TRANSPORTS.find((t) => t.id === s.transport);
  const companion = COMPANIONS.find((c) => c.id === s.companion);
  const theme = THEMES.find((t) => t.id === s.theme);
  const activityType = ACTIVITY_TYPES.find((a) => a.id === s.activityType);
  const pace = PACES.find((p) => p.id === s.pace);
  const destination = s.destination || "（行き先・日程が未記入です。具体的に書いてください）";

  const lines = [];
  lines.push("あなたは、地元事情にも詳しいプロの旅行プランナーです。");
  lines.push("");
  lines.push("【旅行の基本情報】");
  if (s.departure) lines.push(`出発地点：${s.departure}`);
  lines.push(destination);
  if (transport) lines.push(`交通手段：${transport.text}`);
  if (companion) lines.push(`同行者：${companion.text}`);
  if (s.companion === "family" && s.kidsAges) lines.push(`お子さまの年齢：${s.kidsAges}`);
  lines.push(`一人当たりの予算：${s.budget || "指定なし（無理のない範囲でお願いします）"}`);
  if (theme) lines.push(`旅のテーマ：${theme.text}`);
  lines.push("");
  lines.push("【楽しみ方の希望】");
  lines.push(`・${activityType ? activityType.text : "アクティビティと鑑賞のバランスが良いプラン"}`);
  lines.push(`・ペース：${pace ? pace.text : "無理のないペース"}`);
  if (s.foodPref) lines.push(`・食事の好み・制約：${s.foodPref}`);
  lines.push("");
  lines.push("【依頼内容】");
  if (s.wantBooklet) {
    lines.push("1枚の旅のしおりを作ってください。");
    lines.push("PDFやキャンバス機能など、見た目を作り込める機能に対応している場合は、それを使って色分けされたカードや表を使った、実際のしおりのような見た目に仕上げてください。（対応していない場合は、表やチェックリストを使ってできる範囲で見やすく整えてください）");
  }
  lines.push("1. 日程ごとの行程表を作成してください（「時間帯／スポット名／内容・メモ」が分かる表形式で、移動時間もざっくり考慮してください）");
  lines.push("2. 行程の中に、目的地付近で人気のお店やスポットも組み込んでください（定番だけでなく、少し穴場のものも1〜2件混ぜてください）");
  if (s.wantPackingList) {
    lines.push("3. 持ち物リストも、「衣類」「貴重品」「常備薬・衛生用品」などカテゴリ分けしたチェックリスト形式（□）で作成してください");
  }
  if (s.wantImages) {
    lines.push("・行き先やスポットのイメージに合う画像・写真も、可能であれば追加してください");
  }
  if (s.mustHave) lines.push(`・絶対に外せない条件：${s.mustHave}`);
  if (s.wantWeatherPlan) lines.push("・雨天時の代替案も、あわせて教えてください");
  lines.push("・価格や営業時間は変わっている可能性があるため、その旨を一言添えてください");
  lines.push("・質問がある場合は、一度に1〜2個までにしてください");

  let body = lines.join("\n");

  if (s.extraRequest) {
    body += `\n\n【追加のお願い】\n${s.extraRequest}`;
  }

  return body;
}

async function copyText(text) {
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch (e) {}
  try {
    const el = document.createElement("textarea");
    el.value = text;
    el.style.position = "fixed";
    el.style.opacity = "0";
    document.body.appendChild(el);
    el.focus();
    el.select();
    const ok = document.execCommand && document.execCommand("copy");
    document.body.removeChild(el);
    return !!ok;
  } catch (e) {}
  return false;
}

function csvCell(v) {
  const s = String(v ?? "").replace(/"/g, '""');
  return `"${s}"`;
}

function downloadHistoryCSV(history) {
  const header = ["日時", "概要", "プロンプト"].map(csvCell).join(",");
  const rows = history.map((h) => [h.timestamp, h.label, h.prompt].map(csvCell).join(","));
  const csv = "\uFEFF" + [header, ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `travel-prompt-history-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

        addHistoryEntry(buildHistoryLabel(s), prompt);
        logToAdminSheet("旅行プランニング", buildHistoryLabel(s), prompt);
        setTimeout(() => setCopied(false), 1800);
        return;
      }
    } catch (e) {}

      const el = promptRef.current;
      if (el) {
        el.focus();
        el.select();
        el.setSelectionRange(0, prompt.length);
        const ok = document.execCommand && document.execCommand("copy");

                      flexShrink: 0,
                      background: s.wantBooklet ? theme.base : "#FFFFFF",
                      border: s.wantBooklet ? "none" : "2px solid #D8CDD8",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#FFFFFF",
                      fontSize: 13,
                      fontWeight: 700,
                    }}
                  >
                    {s.wantBooklet ? "✓" : ""}
                  </span>
                  <span>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>「旅のしおり」風にまとめてほしい</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                      表やチェックリストを使った、見やすい一枚のまとめにします
                    </div>
                  </span>
                </button>

                <button
                  onClick={() => update("wantImages", !s.wantImages)}
                  style={{
                    display: "flex",
                    alignItems: "center",
                    gap: 10,
                    width: "100%",
                    textAlign: "left",
                    borderRadius: 16,
                    padding: "14px 16px",
                    border: s.wantImages ? `2px solid ${theme.base}` : "2px solid #F1E4E8",
                    background: s.wantImages ? theme.soft : "#FFFFFF",
                    cursor: "pointer",
                    fontFamily: "inherit",
                  }}
                >
                  <span
                    style={{
                      width: 20,
                      height: 20,
                      borderRadius: 6,
                      flexShrink: 0,
                      background: s.wantImages ? theme.base : "#FFFFFF",
                      border: s.wantImages ? "none" : "2px solid #D8CDD8",
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "center",
                      color: "#FFFFFF",
                      fontSize: 13,
                      fontWeight: 700,
                    }}
                  >
                    {s.wantImages ? "✓" : ""}
                  </span>
                  <span>
                    <div style={{ fontWeight: 700, fontSize: 14, color: COLORS.ink }}>イメージ写真も入れてほしい</div>
                    <div style={{ fontSize: 12, color: COLORS.inkSoft, marginTop: 2 }}>
                      対応しているツールの場合、スポットのイメージ画像も追加されます
                    </div>
                  </span>
                </button>
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 style={sectionTitle}>完成プラン — このままコピーして使えます</h2>
              <textarea
                ref={promptRef}
                readOnly
                value={prompt}
                onFocus={(e) => e.target.select()}
                style={{
                  width: "100%",
                  boxSizing: "border-box",
                  background: "#332B3A",
                  color: "#FCEEF2",
                  padding: "18px 16px",
                  fontSize: 14,
                  lineHeight: 1.7,
                  fontFamily: "ui-monospace, SFMono-Regular, Menlo, Consolas, monospace",
                  whiteSpace: "pre-wrap",
                  wordBreak: "break-word",
                  marginTop: 14,
                  border: "none",
                  borderRadius: 18,
                  resize: "vertical",
                  height: 260,
                }}
              />
              <div style={{ fontSize: 11.5, color: "#B3A5A8", marginTop: 6 }}>
                ボタンが反応しない場合は、上のテキストをタップ／クリックすると全選択されるので、Ctrl+C（Macは⌘+C）でコピーできます。
              </div>
              <button
                onClick={handleCopy}
                style={{
                  marginTop: 14,
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 8,
                  padding: "12px 22px",
                  borderRadius: 999,
                  backgroundImage: RAINBOW_GRADIENT,
                  color: "#FFFFFF",
                  border: "none",
                  fontSize: 14,
                  fontWeight: 700,
                  cursor: "pointer",
                  boxShadow: "0 4px 0 #3D3641",
                }}
              >
                {copied ? <Check size={15} /> : <Copy size={15} />}
                {copied ? "コピーしました" : "プロンプトをコピー"}
              </button>
              {copyFailed && (
                <div style={{ marginTop: 8, fontSize: 12, color: "#D14F71", fontWeight: 600 }}>
                  自動コピーができませんでした。上のテキストが選択状態になっているので、Ctrl+C（Macは⌘+C）でコピーしてください。
                </div>
              )}

              <div style={{ marginTop: 24 }}>
                <label style={fieldLabel}>
                  もう一声！やっぱりここが欲しい、があれば
                  <HelpNote theme={theme}>あとから思いついた条件をここに書くと、末尾に「追加のお願い」として反映されます。</HelpNote>
                </label>
                <textarea
                  value={s.extraRequest}
                  onChange={(e) => update("extraRequest", e.target.value)}
                  placeholder="例：写真映えするスポットを優先してほしい"
                  style={textareaStyle}
                  rows={2}
                />
              </div>

              <div style={{ marginTop: 26 }}>
                <div
                  style={{
                    fontSize: 11,
                    letterSpacing: "0.1em",
                    fontWeight: 700,
                    marginBottom: 10,
                    fontFamily: headingFont,
                    backgroundImage: RAINBOW_GRADIENT,
                    WebkitBackgroundClip: "text",
                    WebkitTextFillColor: "transparent",
                    backgroundClip: "text",
                  }}
                >
                  ✨ この設計図に使われている工夫
                </div>
                <div style={{ display: "grid", gap: 10 }}>
                  {PRINCIPLES.map((p, i) => (
                    <div key={p.tag} style={{ display: "flex", gap: 10, alignItems: "flex-start" }}>
                      <div
                        style={{
                          fontSize: 11,
                          fontWeight: 700,
                          color: STEP_THEMES[i % STEP_THEMES.length].text,
                          background: STEP_THEMES[i % STEP_THEMES.length].soft,
                          borderRadius: 999,
                          padding: "3px 10px",
                          height: "fit-content",
                          whiteSpace: "nowrap",
                        }}
                      >
                        {p.tag}
                      </div>
                      <div style={{ fontSize: 13, color: COLORS.ink, lineHeight: 1.5 }}>{p.body}</div>
                    </div>
                  ))}
                </div>
              </div>

              <button onClick={reset} style={resetBtn}>
                <RotateCcw size={13} />
                最初からやり直す
              </button>
            </div>
          )}
        </div>

        {/* Nav */}
        <div style={{ display: "flex", justifyContent: "space-between", marginTop: 18 }}>
          <button
            onClick={() => setStep((v) => Math.max(0, v - 1))}
            disabled={step === 0}
            style={{ ...navBtn, visibility: step === 0 ? "hidden" : "visible" }}
          >
            <ArrowLeft size={14} /> 戻る
          </button>
          {step < 4 && (
            <button
              onClick={() => setStep((v) => Math.min(4, v + 1))}
              disabled={!canNext}
              style={{ ...navBtn, opacity: canNext ? 1 : 0.4, cursor: canNext ? "pointer" : "not-allowed" }}
            >
              {step === 3 ? "プランを完成させる" : "次へ"} <ArrowRight size={14} />
            </button>
          )}
        </div>

        <div style={{ textAlign: "center", marginTop: 32, fontSize: 11.5, color: "#B3A5A8" }}>
          <a
            href="https://note.com/cleaning3104"
            target="_blank"
            rel="noopener noreferrer"
            style={{ color: "#8C7F8E", textDecoration: "none", fontWeight: 700 }}
          >
            PROMPT LAB
          </a>{" "}
          by さとぽん
          <span style={{ margin: "0 6px" }}>·</span>
          <button
            onClick={() => setShowChangelog((v) => !v)}
            style={{
              background: "none",
              border: "none",
              color: "#B3A5A8",
              textDecoration: "underline",
              fontSize: 11.5,
              cursor: "pointer",
              fontFamily: "inherit",
              padding: 0,
            }}
          >
            ver.{VERSION}（更新履歴）
          </button>
        </div>

        {showChangelog && (
          <div
            style={{
              marginTop: 12,
              background: "#FFFFFF",
              borderRadius: 16,
              padding: "16px 18px",
              boxShadow: "0 4px 14px rgba(0,0,0,0.06)",
              maxWidth: 420,
              marginLeft: "auto",
              marginRight: "auto",
            }}
          >
            <div style={{ fontSize: 11, fontWeight: 700, color: "#8C7F8E", marginBottom: 8 }}>更新履歴</div>
            <div style={{ display: "grid", gap: 8 }}>
              {CHANGELOG.map((c) => (
                <div key={c.version} style={{ fontSize: 12, color: "#4A3F41", lineHeight: 1.5 }}>
                  <span style={{ fontWeight: 700 }}>v{c.version}</span>
                  <span style={{ color: "#B3A5A8" }}> ({c.date})</span> — {c.notes}
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

const sectionTitle = { margin: 0, fontFamily: headingFont, fontSize: 20, fontWeight: 700, color: "#3D3641" };
const sectionSub = { margin: "6px 0 0", fontSize: 13, color: "#8C7F8E" };
const fieldLabel = { display: "block", fontSize: 13, fontWeight: 700, color: "#3D3641", margin: "18px 0 8px" };

const textareaStyle = {
  width: "100%",
  border: "2px solid #F1E4E8",
  borderRadius: 16,
  background: "#FFFDFB",
  padding: "12px 14px",
  fontSize: 16,
  fontFamily: "inherit",
  resize: "vertical",
  boxSizing: "border-box",
  color: "#3D3641",
};

const resetBtn = {
  marginTop: 22,
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "9px 16px",
  borderRadius: 999,
  background: "#FFFFFF",
  color: "#8C7F8E",
  border: "2px solid #F1E4E8",
  fontSize: 12.5,
  cursor: "pointer",
};

const navBtn = {
  display: "inline-flex",
  alignItems: "center",
  gap: 6,
  padding: "11px 22px",
  borderRadius: 999,
  background: "#3D3641",
  color: "#FFFFFF",
  border: "none",
  fontSize: 13.5,
  fontWeight: 700,
  cursor: "pointer",
  boxShadow: "0 4px 0 #241F28",
};

const chipButtonSmall = {
  padding: "6px 12px",
  borderRadius: 999,
  border: "1.5px solid #F1E4E8",
  background: "#FFFFFF",
  color: "#3D3641",
  fontSize: 11.5,
  fontWeight: 700,
  cursor: "pointer",
  fontFamily: "inherit",
  whiteSpace: "nowrap",
};

ReactDOM.createRoot(document.getElementById("root")).render(<TravelPromptTool />);

</script>

<script>
  // Babelの自動変換だと "automatic runtime" になり import 文が入って
  // ブラウザ上で構文エラーになるため、classic runtime を明示して手動で変換・実行する
  (function () {
    const source = document.getElementById("app-source").textContent;
    const transformed = Babel.transform(source, {
      presets: [["react", { runtime: "classic" }]],
    }).code;
    try {
      // eslint-disable-next-line no-eval
      (0, eval)(transformed);
    } catch (e) {
      document.getElementById("root").innerHTML =
        "<div style='padding:24px;font-family:sans-serif;color:#B0472F;'>読み込みエラーが発生しました: " +
        (e && e.message ? e.message : e) +
        "</div>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
