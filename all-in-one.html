<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>PROMPT LAB — 全部乗せ</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  * { box-sizing: border-box; }
  button { font: inherit; }

  body {
    font-family: 'Hiragino Sans', 'Yu Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #F3F1F5;
  }

  /* ---------- ゲート画面 ---------- */
  #gate {
    min-height: 100vh;
    background: #FFFBF5;
    background-image:
      radial-gradient(circle at 10% 10%, #FFE3EA 0%, transparent 30%),
      radial-gradient(circle at 90% 15%, #FFE7D6 0%, transparent 30%),
      radial-gradient(circle at 15% 90%, #DFF4E9 0%, transparent 30%),
      radial-gradient(circle at 85% 85%, #E4EBFF 0%, transparent 30%),
      radial-gradient(circle at 50% 50%, #ECE4FD 0%, transparent 40%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #gate .box {
    background: #FFFFFF;
    border-radius: 24px;
    box-shadow: 0 6px 20px rgba(61,54,65,0.1);
    padding: 32px 28px;
    width: 100%;
    max-width: 380px;
    text-align: center;
  }
  #gate .eyebrow {
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 0.04em;
    background-image: linear-gradient(90deg, #FF6F91, #FF8A4C, #34B87A, #5B8DEF, #9B7BEF);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  #gate .toolname {
    font-size: 15px;
    font-weight: 700;
    color: #3D3641;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  #gate h1 {
    margin: 0 0 18px;
    font-size: 15px;
    font-weight: 700;
    color: #8C7F8E;
    padding-top: 14px;
    border-top: 1px dashed #F1E4E8;
  }
  #gate input {
    width: 100%;
    box-sizing: border-box;
    border: 2px solid #F1E4E8;
    border-radius: 16px;
    padding: 10px 14px;
    font-size: 16px;
    margin-bottom: 12px;
  }
  #gate button.submit {
    width: 100%;
    padding: 12px;
    border-radius: 999px;
    background-image: linear-gradient(90deg, #FF6F91, #FF8A4C, #34B87A, #5B8DEF, #9B7BEF);
    color: #FFFFFF;
    border: none;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 0 #3D3641;
  }
  #gate .err {
    color: #D14F71;
    font-size: 12.5px;
    font-weight: 600;
    margin-top: 10px;
    min-height: 16px;
  }
  #gate .note {
    margin-top: 16px;
    font-size: 11px;
    color: #B3A5A8;
    line-height: 1.6;
  }

  /* ---------- タブ画面 ---------- */
  #app {
    display: none;
    height: 100vh;
    flex-direction: column;
  }
  #tabbar {
    display: flex;
    overflow-x: auto;
    gap: 6px;
    padding: 10px 10px 0;
    background: #FFFFFF;
    box-shadow: 0 2px 8px rgba(61,54,65,0.06);
    flex-shrink: 0;
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, #FF6F91, #FF8A4C, #34B87A, #5B8DEF, #9B7BEF) 1;
  }
  #tabbar button {
    flex-shrink: 0;
    border: none;
    background: #F3F1F5;
    color: #4A3F41;
    padding: 10px 16px;
    border-radius: 12px 12px 0 0;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    opacity: 0.6;
  }
  #tabbar button.active {
    opacity: 1;
    color: #FFFFFF;
  }
  #frame-wrap {
    flex: 1;
    position: relative;
  }
  #frame-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <div class="eyebrow">PROMPT LAB</div>
    <div class="toolname">全部乗せ（6ツールセット）</div>
    <h1>合言葉を入力してください</h1>
    <input type="password" id="gate-input" placeholder="合言葉" autocomplete="off" />
    <button class="submit" id="gate-btn">開く</button>
    <div class="err" id="gate-err"></div>
    <div class="note">※このページには6つのツールがすべて含まれます。単体で購入された方は、それぞれの個別ページの合言葉をご利用ください。</div>
  </div>
</div>

<div id="app">
  <div id="tabbar"></div>
  <div id="frame-wrap">
    <iframe id="tool-frame" title="ツール表示エリア"></iframe>
  </div>
</div>

<script>
  const BUNDLE_PASSWORD = "zenbunose"; // ここを好きな合言葉に変更してください

  const TABS = [
    { key: "business", label: "業務効率化", file: "index.html", color: "#5B8DEF" },
    { key: "image", label: "画像生成", file: "image-prompt-tool.html", color: "#FF8A4C" },
    { key: "chat", label: "なんでも相談", file: "chat-prompt-tool.html", color: "#FF6F91" },
    { key: "writing", label: "文章作成", file: "writing-prompt-tool.html", color: "#34B87A" },
    { key: "study", label: "学習・勉強", file: "study-prompt-tool.html", color: "#9B7BEF" },
    { key: "travel", label: "旅行プランニング", file: "travel-prompt-tool.html", color: "#E0A421" },
  ];

  function buildTabs() {
    const bar = document.getElementById("tabbar");
    TABS.forEach((t, i) => {
      const btn = document.createElement("button");
      btn.textContent = t.label;
      btn.dataset.key = t.key;
      if (i === 0) {
        btn.classList.add("active");
        btn.style.background = t.color;
      }
      btn.addEventListener("click", () => selectTab(t.key));
      bar.appendChild(btn);
    });
  }

  function selectTab(key) {
    const tab = TABS.find((t) => t.key === key);
    if (!tab) return;
    document.getElementById("tool-frame").src = tab.file;
    document.querySelectorAll("#tabbar button").forEach((b) => {
      const t = TABS.find((x) => x.key === b.dataset.key);
      if (b.dataset.key === key) {
        b.classList.add("active");
        b.style.background = t.color;
      } else {
        b.classList.remove("active");
        b.style.background = "#F3F1F5";
      }
    });
  }

  function unlockBundle() {
    // 各ツール個別ページのゲートを、このセッション内では自動突破させる
    TABS.forEach((t) => {
      try {
        sessionStorage.setItem("pb_unlocked_" + t.key, "1");
      } catch (e) {}
    });
    document.getElementById("gate").style.display = "none";
    document.getElementById("app").style.display = "flex";
    buildTabs();
    selectTab(TABS[0].key);
    try {
      sessionStorage.setItem("pb_bundle_unlocked", "1");
    } catch (e) {}
  }

  document.getElementById("gate-btn").addEventListener("click", tryUnlock);
  document.getElementById("gate-input").addEventListener("keydown", (e) => {
    if (e.key === "Enter") tryUnlock();
  });

  function tryUnlock() {
    const val = document.getElementById("gate-input").value;
    if (val === BUNDLE_PASSWORD) {
      unlockBundle();
    } else {
      document.getElementById("gate-err").textContent = "合言葉が違います。もう一度確認してください。";
    }
  }

  if (sessionStorage.getItem("pb_bundle_unlocked") === "1") {
    unlockBundle();
  }
</script>

</body>
</html>
